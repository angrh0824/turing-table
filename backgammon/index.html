<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バックギャモン — チューリング・テーブル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 配置: 盤が主役。縦の画面は 上の対局者 → 盤 → 情報の行・棋譜テープ → 下の対局者 → 操作 の順に1列。
   横の低い画面は左に盤、右に対局者・情報・操作。広い画面は右に形勢・グラフ・棋譜のパネル */
:root {
  --bg: #ece6dc;
  --surface: #faf7f1;
  --surface-2: #f0ebe1;
  --surface-3: #e4ddd0;
  --ink: #231c16;
  --muted: #6c6157;
  --line: #d3c9b9;
  --accent: #2f5d50;
  --accent-soft: rgba(47, 93, 80, .14);
  --accent-ink: #ffffff;
  --gold: #a5771c;
  --good: #2c7a4b;
  --bad: #b23c2a;
  --shadow: 0 1px 2px rgba(40, 25, 10, .22), 0 10px 26px rgba(40, 25, 10, .14);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-latin: "Cormorant Garamond", "Shippori Mincho B1", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --radius: 12px;
  /* 盤（木と革） */
  --wood-a: #6e4428; --wood-b: #8d5c36; --wood-c: #563219;
  --field-a: #33503f; --field-b: #22382b;
  --pt-a1: #efe2c4; --pt-a2: #d8c39b;
  --pt-b1: #973431; --pt-b2: #6e201d;
  --stitch: #cbb68a; --stitch-a: #9b8456; --stitch-b: #e0a88f;
  --tray: #253b2e;
  --ck-w1: #fffcf4; --ck-w2: #efe3ca; --ck-w3: #d0bc95; --ck-w-edge: #9a8258;
  --ck-b1: #5a362b; --ck-b2: #2e1812; --ck-b3: #160a06; --ck-b-edge: #0c0503;
  --sel-ring: #3a8cff;
  --dest: #ffd36a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --surface: #1b1917; --surface-2: #24211e; --surface-3: #2e2a26; --ink: #ece6dc; --muted: #a1978b; --line: #383430;
    --accent: #7fc0aa; --accent-soft: rgba(127, 192, 170, .15); --accent-ink: #0d1a15; --gold: #d8ab46; --good: #62c08a; --bad: #e77b66;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px rgba(0, 0, 0, .4);
    --field-a: #2b4536; --field-b: #1a2c21; --tray: #1d2f24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1b1917; --surface-2: #24211e; --surface-3: #2e2a26; --ink: #ece6dc; --muted: #a1978b; --line: #383430;
  --accent: #7fc0aa; --accent-soft: rgba(127, 192, 170, .15); --accent-ink: #0d1a15; --gold: #d8ab46; --good: #62c08a; --bad: #e77b66;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px rgba(0, 0, 0, .4);
  --field-a: #2b4536; --field-b: #1a2c21; --tray: #1d2f24;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; width: 100%; max-width: 1280px; margin: 0 auto; padding-block: 10px 8px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .08em; margin: 0; line-height: 1; white-space: nowrap; }
.brand span { color: var(--muted); font-family: var(--font-latin); font-size: 14px; letter-spacing: .22em; white-space: nowrap; }
.brand .home { align-self: center; color: var(--muted); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 2px 3px; border-radius: 6px; }
.brand .home:hover, .brand .home:focus-visible { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: none; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1280px; margin: 0 auto; flex: 1 1 auto; min-height: 0; overflow: hidden; padding-bottom: 8px; }
main.doc-scroll { overflow-y: auto; overscroll-behavior: contain; }

/* ---------- 対局画面 ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; height: 100%; }
.lay-wide .play { grid-template-columns: minmax(0, 1fr) 340px; }
.board-col { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "." "top" "board" "foot" "bottom" "." "ctrl"; grid-template-rows: minmax(0, .45fr) auto auto auto auto minmax(0, 1fr) auto; row-gap: 6px; justify-items: center; min-width: 0; min-height: 0; height: 100%; }
.board-col > .gap-fix { display: none; }
.board-col > * { width: 100%; max-width: var(--board-w, 640px); }
#player-top { grid-area: top; } #board-wrap { grid-area: board; } .boardfoot { grid-area: foot; } #player-bottom { grid-area: bottom; } .controls { grid-area: ctrl; }
/* 横の低い画面: 左に盤、右に情報 */
.lay-land .board-col { grid-template-columns: auto minmax(260px, 1fr); grid-template-areas: "board top" "board foot" "board bottom" "board ctrl"; grid-template-rows: auto auto auto 1fr; justify-items: stretch; align-items: start; column-gap: 12px; height: 100%; }
.lay-land .board-col > * { max-width: none; }
.lay-land #board-wrap { width: var(--board-w, 420px); }

/* 対局者カード */
.player {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; min-height: 46px;
  transition: border-color .2s, box-shadow .2s;
}
.player.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.player .chip { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.chip.w { background: radial-gradient(circle at 38% 32%, var(--ck-w1), var(--ck-w2) 62%, var(--ck-w3)); border: 1px solid var(--ck-w-edge); }
.chip.b { background: radial-gradient(circle at 38% 32%, var(--ck-b1), var(--ck-b2) 62%, var(--ck-b3)); border: 1px solid var(--ck-b-edge); }
.player .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: nowrap; }
.player .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.player .right { display: flex; align-items: center; gap: 8px; justify-self: end; white-space: nowrap; }
.player .score { font: 700 20px/1 var(--font-latin); font-variant-numeric: tabular-nums lining-nums; min-width: 1.2em; text-align: right; }
.player .think { font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.player .think i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.player .cubemini { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 3px; border-radius: 5px; background: #f3ecdc; color: #3a2a18; border: 1px solid #a8956e; font: 700 12px/1 var(--font-body); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 盤 */
.board-wrap { position: relative; }
.board-svg { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: var(--shadow); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.board-svg .ptnum text, .board-svg .ptnum { fill: rgba(255, 236, 200, .62); font: 700 14px var(--font-body); }
.board-svg .cnt { font: 800 22px var(--font-body); pointer-events: none; }
.board-svg .cnt-w { fill: #3a2a18; } .board-svg .cnt-b { fill: #f4e8d4; }
.board-svg .cubetxt { font: 700 22px var(--font-latin); fill: #33241a; }
.board-svg .ck { transition: transform .12s; }
.board-svg .ck.movable > circle:nth-child(2) { stroke: var(--dest); stroke-width: 3; }
.board-svg .ck.sel > circle:nth-child(2) { stroke: var(--sel-ring); stroke-width: 4.5; }
.board-svg .ck.sel { filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
.board-svg .dimmer { fill: rgba(10, 8, 5, .44); pointer-events: none; }
.board-svg .destglow { fill: rgba(255, 211, 106, .16); stroke: var(--dest); stroke-width: 2.5; pointer-events: none; }
.board-svg .destring { fill: rgba(255, 211, 106, .25); stroke: var(--dest); stroke-width: 3; stroke-dasharray: 6 4; pointer-events: none; }
.board-svg .destring.hit { stroke: #ff6a4a; fill: rgba(255, 106, 74, .22); }
.board-svg .lastmark { fill: rgba(255, 211, 106, .38); pointer-events: none; }
.board-svg .arrow { fill: none; stroke: rgba(90, 220, 140, .92); stroke-width: 5; stroke-linecap: round; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.board-svg .arrowhead { fill: rgba(90, 220, 140, .95); stroke: rgba(0,0,0,.4); pointer-events: none; }
.board-svg .arrow.last { stroke: rgba(255, 211, 106, .55); stroke-width: 3.5; stroke-dasharray: 7 6; }
.board-svg .arrowhead.last { fill: rgba(255, 211, 106, .6); }
.board-svg .die.used { opacity: .34; }
.board-svg .dice.clickable, .board-svg .cube.clickable, .board-svg .banner.clickable { cursor: pointer; }
.board-svg .cube.clickable > rect:nth-child(2) { stroke: var(--dest); stroke-width: 3; }
.board-svg .cube.offer { animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .62; } }
.board-svg .banner rect { fill: rgba(20, 14, 8, .72); stroke: rgba(255, 220, 160, .5); stroke-width: 1.5; }
.board-svg .banner text { fill: #fbf1dc; font: 700 27px var(--font-body); }
.board-svg .banner.clickable rect { fill: var(--accent); stroke: #fff; }
.board-svg .banner.clickable text { fill: var(--accent-ink); }
.board-svg .hitbox { cursor: pointer; }

/* 盤の下: 情報の行（高さ固定）・評価の行（狭い画面）・棋譜テープ */
.boardfoot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.info { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 12px; font-size: 13px; white-space: nowrap; }
.info .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
.info .txt b { font-weight: 700; }
.info .muted { color: var(--muted); font-size: 12px; }
.info .tools { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
.info.alert { background: color-mix(in srgb, var(--bad) 13%, transparent); }
.info.alert .txt { color: var(--bad); font-weight: 700; }
.info.result { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.info.act { background: var(--accent-soft); }
.info.view { background: var(--surface-2); }
.ibtn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navrow { display: flex; align-items: center; gap: 2px; padding: 3px 4px; border-top: 1px solid var(--line); }
.navrow .ibtn { width: 36px; height: 32px; color: var(--ink); }
.navrow .ibtn[disabled] { opacity: .28; cursor: default; background: transparent; }
.lay-wide .navrow .sheet-btn { display: none; }
.tape { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.tape::-webkit-scrollbar { display: none; }
.tape button { flex: none; border: 0; background: transparent; border-radius: 7px; padding: 4px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.tape button:hover { background: var(--surface-2); }
.tape button .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tape button .dice-t { color: var(--muted); font-size: 11px; }
.tape button.cur { background: var(--accent); color: var(--accent-ink); }
.tape button.cur .dice-t { color: inherit; opacity: .8; }
.tape button.bad { color: var(--bad); }
.tape button.cur.bad { color: var(--accent-ink); }
.tape .sep { flex: none; align-self: center; font-size: 10px; color: var(--muted); padding: 0 4px; white-space: nowrap; }
.evstrip { display: none; grid-template-columns: 70px auto minmax(0, 1fr); align-items: center; gap: 4px 10px; padding: 6px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.evstrip .bar { height: 8px; border-radius: 999px; background: var(--ck-b2); overflow: hidden; }
.evstrip .bar .b { height: 100%; background: var(--ck-w2); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.evstrip .num { font: 700 17px/1 var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.evstrip .num small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.evstrip .best { font-size: 12px; color: var(--good); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.lay-port .evstrip, .lay-land .evstrip { display: grid; }
.eval-off .evstrip { display: none !important; }

/* 選択メニュー（目の組み合わせがあいまいなとき） */
.choose { position: absolute; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.choose .ttl { padding: 4px 6px 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.choose button { border: 0; background: var(--surface-2); min-height: 40px; padding: 8px 12px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 700; }
.choose button.quiet { background: transparent; color: var(--muted); font-weight: 500; }
.choose button:hover, .choose button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.controls { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 210px; }
.lay-land .menu { bottom: auto; top: calc(100% + 6px); }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); font-weight: 700; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.bad { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- 形勢パネル（広い画面は右に常に、狭い画面は下からせり上がる） ---------- */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.sheet-head { display: none; }
.lay-wide .side { overflow: hidden; }
.lay-wide .side .kifucard { flex: 1 1 auto; min-height: 140px; display: flex; flex-direction: column; overflow: hidden; }
.lay-wide .side .kifucard .kifu { flex: 1 1 auto; }
.lay-wide .side .evcard { flex: none; max-height: 52%; overflow-y: auto; }
.lay-port .side, .lay-land .side {
  position: fixed; left: 0; right: 0; bottom: 0; top: var(--sheet-top, 45%); z-index: 60; gap: 8px;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 28px rgba(0,0,0,.2);
  padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s;
}
.lay-land .side { left: auto; width: min(420px, 56vw); top: 0; border-radius: 16px 0 0 16px; border-top: 0; border-left: 1px solid var(--line); transform: translateX(105%); }
.lay-port .side.open, .lay-land .side.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.lay-port .sheet-head, .lay-land .sheet-head { display: flex; align-items: center; gap: 8px; }
.lay-port .sheet-head::before { content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); }
.sheet-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: 1; margin-top: 8px; }
.sheet-tabs button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
.sheet-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.lay-port .side .card, .lay-land .side .card { display: none !important; border: 0; padding: 0; background: transparent; }
.lay-port .side[data-tab="ev"] .evcard, .lay-port .side[data-tab="graph"] .graph,
.lay-land .side[data-tab="ev"] .evcard, .lay-land .side[data-tab="graph"] .graph { display: block !important; flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; }
.lay-port .side[data-tab="kifu"] .kifucard, .lay-land .side[data-tab="kifu"] .kifucard { display: flex !important; flex-direction: column; flex: 1; min-height: 0; }
.side .kifucard .kifu { flex: 1; max-height: none; min-height: 0; }
.lay-port .side .graph svg, .lay-land .side .graph svg { height: calc(100% - 26px); min-height: 90px; }
.eval-off .sheet-tabs [data-st="ev"], .eval-off .sheet-tabs [data-st="graph"] { display: none; }
.eval-off .evcard, .eval-off .graph { display: none !important; }
.evoff-card { display: none; }
.lay-wide.eval-off .evoff-card { display: flex; align-items: center; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { margin-left: auto; letter-spacing: 0; font-weight: 500; }
.wpct { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wpct .v { font-family: var(--font-latin); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.wpct .lbl { color: var(--muted); font-weight: 700; }
.wbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--ck-b2); border: 1px solid var(--line); margin-top: 8px; }
.wbar .b { background: var(--ck-w2); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.probs { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 2px 10px; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.probs .h { color: var(--muted); font-size: 11px; }
.cubebox { margin-top: 10px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); font-size: 12.5px; line-height: 1.6; }
.cubebox b { font-size: 13.5px; }
.cubebox .eqs { color: var(--muted); font-variant-numeric: tabular-nums; }
.cands { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cands li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr) auto auto; gap: 8px; padding: 3px 6px; border-radius: 7px; cursor: pointer; }
.cands li:hover { background: var(--surface-2); }
.cands li.best { color: var(--good); font-weight: 700; }
.cands li.chosen { background: var(--accent-soft); }
.cands .d { color: var(--muted); font-size: 11px; }
.meta { color: var(--muted); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.graph svg { width: 100%; height: 120px; display: block; cursor: pointer; }
.graph .axis { stroke: var(--line); }
.graph .mid { stroke: var(--muted); stroke-dasharray: 3 3; opacity: .6; }
.graph .area { fill: color-mix(in srgb, var(--accent) 18%, transparent); }
.graph .line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.graph .now { stroke: var(--gold); stroke-width: 1.5; }
.graph .gsep { stroke: var(--muted); stroke-width: 1; opacity: .35; }
.graph text { fill: var(--muted); font-size: 9px; }
.kifu { position: relative; max-height: 300px; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: 13px; font-variant-numeric: tabular-nums; }
.kifu li { display: grid; grid-template-columns: 2.2em 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 7px; cursor: pointer; }
.kifu li.gh { display: block; cursor: default; color: var(--muted); font-size: 11px; letter-spacing: .08em; padding-top: 8px; }
.kifu li:hover:not(.gh) { background: var(--surface-2); }
.kifu li.cur { background: var(--accent-soft); }
.kifu .no { color: var(--muted); text-align: right; font-size: 11px; }
.kifu .dot { width: 10px; height: 10px; border-radius: 50%; }
.kifu .ev { color: var(--muted); font-size: 11px; }
.kifu .ev.bad { color: var(--bad); font-weight: 700; }
.row-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* ---------- ダイアログ ---------- */
/* 高さの決まった flex の中に置くので、max-height: 100% が画面の高さで効く（はみ出す分はシートの中だけスクロール） */
.overlay { position: fixed; inset: 0; background: rgba(8, 6, 4, .52); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; flex: none; }
.dialog h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 23px; }
.field { display: grid; gap: 7px; margin-bottom: 15px; align-content: start; }
.field > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 13px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.cards button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 11px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.cards button b { font-size: 15px; }
.cards button small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.cards button .stars { color: var(--gold); letter-spacing: 2px; font-size: 12px; }
.cards button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.dialog textarea { width: 100%; min-height: 160px; font: 13px/1.6 var(--font-body); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.result-title { font-family: var(--font-display); font-size: 32px; margin: 0; }
@media (max-width: 560px) {
  .overlay { padding: 10px; align-items: end; }
  .dialog { padding: 14px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 16px; max-height: 100%; }
  .dialog h2 { font-size: 19px; margin-bottom: 8px; }
  .field { margin-bottom: 10px; gap: 5px; }
  .seg { gap: 4px; }
  .seg button { padding: 5px 9px; font-size: 13px; }
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .cards button { padding: 7px 4px; text-align: center; border-radius: 10px; }
  .cards button b { font-size: 13px; }
  .cards button small { display: none; }
  .cards button .stars { letter-spacing: 0; font-size: 10px; }
  .on-stats { gap: 16px; margin-bottom: 6px; }
  .on-stats .stat b { font-size: 24px; }
  .on-stats .stat span { font-size: 11px; }
  #dlg-online .field { margin-bottom: 9px; }
  #dlg-online .on-note { font-size: 10.5px; margin: 0; }
  .on-msg { margin-bottom: 8px; padding: 6px 10px; }
  .on-ai .hint { display: none; }
  .on-list { max-height: 24vh; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .overlay { padding: 8px; }
  .dialog { padding: 12px 16px; }
  .dialog h2 { font-size: 18px; margin-bottom: 6px; }
  .field { margin-bottom: 8px; gap: 4px; }
  .field .hint { font-size: 11px; line-height: 1.45; }
  .seg { gap: 4px; }
  .seg button { padding: 5px 10px; font-size: 13px; }
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .cards button { padding: 6px 4px; text-align: center; border-radius: 10px; }
  .cards button b { font-size: 13px; }
  .cards button small { display: none; }
  .cards button .stars { letter-spacing: 0; font-size: 10px; }
  /* 新しい対局: 横に2列（左に種類・形式、右に強さ・キューブ）で1画面に収める */
  #dlg-new .dialog { width: min(820px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 18px; align-content: start; }
  #dlg-new .dialog > h2, #dlg-new .dialog > .actions { grid-column: 1 / -1; }
  #dlg-new .dialog > .actions { margin-top: 0; }
  /* オンライン: 横に2列（名前・AI補助 | 待っている人・自分が待つ） */
  #dlg-online .dialog { width: min(820px, 100%); }
  #on-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 18px; }
  #on-body > .on-stats, #on-body > .on-msg, #on-body > .on-note { grid-column: 1 / -1; }
  #on-body .on-stats { margin-bottom: 4px; gap: 16px; }
  #on-body .on-stats .stat b { font-size: 22px; }
  #dlg-online h2 { margin-bottom: 4px; }
  #dlg-online .on-ai .hint { display: none; }
  #dlg-online .on-note { font-size: 10.5px; margin: 0; }
  #dlg-online .on-list { max-height: 34vh; }
}
/* オンライン */
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }
.onbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.onbtn[data-st="on"] .dot { background: #2fb36a; opacity: 1; box-shadow: 0 0 0 3px rgba(47, 179, 106, .25); }
.onbtn[data-st="connecting"] .dot { background: var(--gold); opacity: 1; }
.onbtn small { font-weight: 500; color: var(--muted); }
.on-stats { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
.on-stats .stat b { display: block; font-family: var(--font-latin); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; }
.on-stats .stat span { color: var(--muted); font-size: 12px; }
.on-conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.on-conn[data-st="on"] { color: var(--good); }
.on-msg { margin: 0 0 12px; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; }
.on-list { display: grid; gap: 6px; max-height: 220px; overflow-y: auto; }
.on-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.on-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.on-ai, .on-wait { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.on-wait { flex-direction: column; align-items: flex-start; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; font-size: 16px; }
input.text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.aitag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.aitag.off { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.aitag.on { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold); }
.popover { position: absolute; right: 0; top: 44px; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 9px; min-width: 250px; max-height: calc(100dvh - 70px); overflow-y: auto; }
.settings-wrap { position: relative; flex: none; }

/* ---------- ルール / AI（タブで1枚ずつ） ---------- */
.doc { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; padding-bottom: 12px; }
.doc .card { min-width: 0; overflow-wrap: anywhere; }
.doctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
.doctabs::-webkit-scrollbar { display: none; }
.doctabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.doctabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.doc .card p, .doc .card li { max-width: 72ch; }
.doc h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 6px; }
.doc .fig { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
.doc .fig svg { width: 100%; height: auto; border-radius: 10px; }
@media (max-width: 640px) { .doc .fig { grid-template-columns: minmax(0, 1fr); gap: 8px; } .doc .fig svg { max-width: min(100%, 360px); } }
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.lv th, table.lv td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
.tbl { overflow-x: auto; }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-latin); font-size: 30px; font-variant-numeric: tabular-nums lining-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.doc a { color: var(--accent); }
@media (max-width: 560px) {
  .doc { gap: 9px; }
  .doc .card { padding: 10px 12px; }
  .doc h3 { font-size: 16px; margin-bottom: 4px; }
  .doc .card ul { padding-left: 18px; margin: 4px 0; }
  .doc .card li { font-size: 12.5px; line-height: 1.55; margin-bottom: 2px; }
  .doc .card p { font-size: 12.5px; line-height: 1.55; margin: 5px 0; }
  .doc .stat b { font-size: 22px; }
}

/* ---------- 狭い画面の詰め ---------- */
@media (max-width: 560px) {
  .top { gap: 6px; padding-block: 6px 6px; }
  .brand { gap: 6px; }
  .brand h1 { font-size: 19px; letter-spacing: .03em; }
  .brand span { display: none; }
  .tabs button { padding: 5px 9px; font-size: 12.5px; }
  .iconbtn { width: 32px; height: 32px; }
  .onbtn { height: 32px; padding: 0 8px; gap: 5px; font-size: 12px; }
  .onbtn .lbl { display: none; }
  .onbtn[data-st="off"] .lbl, .onbtn[data-st="error"] .lbl { display: inline; }
  .on-row { grid-template-columns: minmax(0, 1fr) auto; }
  .on-row .hint { grid-column: 1; }
  .board-col { gap: 5px; }
  .player { padding: 4px 10px; min-height: 40px; gap: 0 8px; }
  .player .chip { width: 19px; height: 19px; }
  .player .score { font-size: 18px; }
  .controls { gap: 6px; }
  .controls .btn { padding: 6px 9px; font-size: 13px; }
  .controls .wide { display: none; }
  .info { height: 40px; font-size: 12.5px; padding-left: 10px; }
  .navrow .ibtn { width: 32px; }
}
@media (max-width: 430px) {
  .top { gap: 5px; }
  .brand h1 { font-size: 15.5px; letter-spacing: -.01em; }
  .brand .home { font-size: 22px; padding-right: 0; }
  .tabs { padding: 2px; }
  .tabs button { padding: 5px 7px; font-size: 12px; }
  .onbtn small { display: none; }
}
.lay-land .top { padding-block: 4px 4px; }
.lay-land .brand h1 { font-size: 19px; }
.lay-land .brand span { display: none; }
.lay-land .player { min-height: 40px; padding: 4px 10px; }
.lay-land .controls { flex-wrap: wrap; gap: 6px; }
.lay-land .controls .btn { padding: 5px 9px; font-size: 12.5px; }
.lay-land .controls .wide { display: none; }
@media (prefers-reduced-motion: reduce) {
  .wbar .b, .evstrip .bar .b, .player, .board-svg .ck { transition: none; }
  .board-svg .cube.offer, .player .think i { animation: none; }
}
</style>
</head>
<body class="lay-port">
<header class="top">
  <div class="brand"><a class="home" href="../" title="チューリング・テーブル（ゲームの一覧）" aria-label="チューリング・テーブル（ゲームの一覧）へ">‹</a><h1>バックギャモン</h1><span>BACKGAMMON</span></div>
  <nav class="tabs" role="tablist" aria-label="ページ">
    <button role="tab" id="tab-play" aria-selected="true" data-tab="play">対局</button>
    <button role="tab" id="tab-rules" aria-selected="false" data-tab="rules">ルール</button>
    <button role="tab" id="tab-ai" aria-selected="false" data-tab="ai">AI</button>
  </nav>
  <button class="onbtn" id="btn-online" data-st="off" title="オンライン対戦（いまオンラインの人数・対戦待ちの人数）"><span class="dot"></span><span class="lbl">オンライン</span><span class="cnt"></span></button>
  <div class="settings-wrap">
    <button class="iconbtn" id="btn-settings" aria-label="表示の設定" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <span class="hint" style="margin-bottom:-4px">AI補助（下の「AI補助」でまとめて切り替え）</span>
      <label class="switch"><input type="checkbox" id="set-eval" checked> 形勢（勝率・ギャモン率・キューブ）を表示</label>
      <label class="switch"><input type="checkbox" id="set-arrow" checked> おすすめの手を矢印で表示</label>
      <span class="hint" style="margin-bottom:-4px">操作</span>
      <label class="switch"><input type="checkbox" id="set-autoroll" checked> キューブを使えない番は自動で振る</label>
      <label class="switch"><input type="checkbox" id="set-autoconfirm"> 動かし終えたら自動で確定</label>
      <span class="hint" style="margin-bottom:-4px">表示</span>
      <label class="switch"><input type="checkbox" id="set-mirror"> ホームを左側に</label>
      <label class="switch"><input type="checkbox" id="set-numbers" checked> ポイントの番号</label>
      <label class="switch"><input type="checkbox" id="set-sound" checked> 音</label>
      <label class="switch"><input type="checkbox" id="set-anim" checked> 動きのアニメーション</label>
    </div>
  </div>
</header>

<main id="main">
  <section id="view-play" class="play">
    <div class="board-col" id="board-col">
      <div class="player" id="player-top"></div>
      <div class="board-wrap" id="board-wrap">
        <svg class="board-svg" id="board" role="img" aria-label="バックギャモンの盤"></svg>
        <div class="choose" id="chooser" hidden></div>
      </div>
      <div class="boardfoot">
        <div class="info" id="info" aria-live="polite"></div>
        <div class="evstrip" id="evstrip" role="button" tabindex="0" aria-label="形勢。押すと詳しく">
          <div class="bar"><div class="b" id="evs-b" style="width:50%"></div></div>
          <span class="num" id="evs-num">—</span>
          <span class="best" id="evs-best"></span>
        </div>
        <div class="navrow" id="navrow">
          <button class="ibtn" data-nav="first" aria-label="この局の最初"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
          <button class="ibtn" data-nav="prev" aria-label="1手戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <div class="tape" id="tape" aria-label="棋譜"></div>
          <button class="ibtn" data-nav="next" aria-label="1手進む"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ibtn" data-nav="last" aria-label="最新の局面"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
          <button class="ibtn sheet-btn" data-nav="sheet" aria-label="形勢・グラフ・棋譜を開く" title="形勢・グラフ・棋譜"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
        </div>
      </div>
      <div class="player" id="player-bottom"></div>
      <div class="controls">
        <button class="btn primary" id="btn-new">新しい対局</button>
        <button class="btn" id="btn-undo">待った</button>
        <button class="btn" id="btn-hint">ヒント</button>
        <button class="btn aibtn" id="btn-ai" aria-pressed="true" title="形勢（勝率）とおすすめの手の矢印をまとめて出し入れ"><span class="led"></span>AI補助</button>
        <div class="more-wrap">
          <button class="btn" id="btn-more" aria-label="そのほかの操作" aria-expanded="false">⋯</button>
          <div class="menu" id="menu-more" hidden role="menu">
            <button role="menuitem" id="btn-flip">盤の上下を入れ替える</button>
            <button role="menuitem" id="btn-resign">投了する…</button>
            <button role="menuitem" id="btn-panel">形勢・グラフ・棋譜</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="side" id="side" data-tab="ev" aria-label="形勢と棋譜">
      <div class="sheet-head">
        <div class="sheet-tabs" role="tablist">
          <button role="tab" data-st="ev" aria-selected="true">形勢</button>
          <button role="tab" data-st="graph" aria-selected="false">グラフ</button>
          <button role="tab" data-st="kifu" aria-selected="false">棋譜</button>
        </div>
        <button class="ibtn" data-act="sheet-close" aria-label="閉じる" style="margin-top:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="card evoff-card">
        <span class="hint" style="flex:1">形勢（勝率）は隠しています</span>
        <button class="btn small" data-act="show-eval">表示する</button>
      </div>
      <div class="card evcard" id="evcard"></div>
      <div class="card graph">
        <h2>形勢グラフ<span class="grow" id="graph-who">あなたの勝率</span></h2>
        <svg id="graph" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="手ごとの勝率。クリックでその局面へ"></svg>
      </div>
      <div class="card kifucard">
        <h2>棋譜<span class="grow" id="kifu-info"></span></h2>
        <ol class="kifu" id="kifu"></ol>
        <div class="row-actions">
          <button class="btn small" id="btn-analyze">この対局を分析</button>
          <button class="btn small" id="btn-copy">棋譜をコピー</button>
          <span id="copy-msg"></span>
        </div>
      </div>
    </aside>
  </section>

  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<!-- 新しい対局 -->
<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field"><span class="lab">対局の種類</span><div class="seg" id="ng-mode"></div></div>
    <div class="field" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field" id="ng-watch-field"><span class="lab">観戦するCPU（白・黒）</span><div class="seg" id="ng-cpu-w"></div><div class="seg" id="ng-cpu-b"></div></div>
    <div class="field"><span class="lab">形式</span><div class="seg" id="ng-len"></div><span class="hint" id="ng-len-hint"></span></div>
    <div class="field"><span class="lab">ダブリングキューブ</span><div class="seg" id="ng-cube"></div><span class="hint" id="ng-cube-hint"></span></div>
    <div class="actions">
      <button class="btn" id="ng-cancel">やめる</button>
      <button class="btn primary" id="ng-start">対局を始める</button>
    </div>
  </div>
</div>

<!-- 終局 -->
<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(440px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 4px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <p id="rs-body" style="margin:6px 0 16px"></p>
    <div class="actions">
      <button class="btn" id="rs-review">棋譜を見返す</button>
      <button class="btn" id="rs-new">設定を変える</button>
      <button class="btn primary" id="rs-again">もう一局</button>
    </div>
  </div>
</div>

<!-- 投了 -->
<div class="overlay" id="dlg-resign" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rg-title" style="width:min(440px,100%)">
    <h2 id="rg-title">投了する</h2>
    <p class="hint" id="rg-hint" style="margin-top:0">相手に払う点を選んでください。相手は、もっと取れそうなら断ることがあります。</p>
    <div class="seg" id="rg-kind" style="margin-bottom:14px"></div>
    <p id="rg-msg" class="hint"></p>
    <div class="actions">
      <button class="btn" id="rg-cancel">やめる</button>
      <button class="btn primary" id="rg-ok">この点で投了</button>
    </div>
  </div>
</div>

<!-- オンライン対戦（ロビー） -->
<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンライン対戦</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>

<script src="js/bg-core.js"></script>
<script src="js/bg-net.js"></script>
<script src="js/bg-ai.js"></script>
<script src="js/weights.js" onerror="window.BG_WEIGHTS_MISSING = true"></script>
<script src="js/strength.js" onerror="window.BG_STRENGTH = null"></script>
<script src="js/board.js"></script>
<script src="../common/online.js"></script>
<script src="js/online-bg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
