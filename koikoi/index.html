<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花札こいこい — チューリング・テーブル</title>
<meta name="description" content="AI が自己対局だけで強くなった花札こいこいの CPU と対戦。オンライン対戦も">
<meta name="theme-color" content="#2f4a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 卓が主役。上に相手（手札の裏・取り札）、真ん中に場と山札、すぐ下に情報の行、下に自分（取り札・手札）。横長の画面では取り札を左、操作を右に */
:root {
  --bg: #ebe4d4;
  --surface: #f8f3e8;
  --surface-2: #efe7d7;
  --surface-3: #e4dac6;
  --ink: #221e1a;
  --muted: #6c6358;
  --line: #d5cab6;
  --accent: #b9412c;
  --accent-soft: rgba(185, 65, 44, .13);
  --accent-ink: #ffffff;
  --gold: #a47c26;
  --good: #2e7a4f;
  --bad: #b23c2a;
  --mat: #35523f;
  --mat-hi: #44654f;
  --mat-lo: #263d2f;
  --mat-ink: #f3ecdc;
  --mat-muted: rgba(243, 236, 220, .62);
  --mat-line: rgba(243, 236, 220, .16);
  --sel: #f2c14e;
  --match: #ffe08a;
  --shadow: 0 1px 2px rgba(30, 25, 15, .22), 0 8px 24px rgba(30, 25, 15, .12);
  --card-shadow: 0 1px 1px rgba(0, 0, 0, .28), 0 3px 8px rgba(0, 0, 0, .22);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --radius: 12px;
  --cw: 44px;     /* 手札の札の幅（app.js が画面に合わせて決める） */
  --fw: 44px;     /* 場の札の幅 */
  --mw: 24px;     /* 取り札の札の幅 */
  --ow: 22px;     /* 相手の手札（裏）の幅 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111311; --surface: #1a1d1a; --surface-2: #222622; --surface-3: #2b302b; --ink: #ebe5d8; --muted: #9c968a; --line: #323830;
    --accent: #e06c51; --accent-soft: rgba(224, 108, 81, .16); --accent-ink: #1a0f0b; --gold: #d8ab46; --good: #62c08a; --bad: #e77b66;
    --mat: #1f3327; --mat-hi: #294433; --mat-lo: #15241b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111311; --surface: #1a1d1a; --surface-2: #222622; --surface-3: #2b302b; --ink: #ebe5d8; --muted: #9c968a; --line: #323830;
  --accent: #e06c51; --accent-soft: rgba(224, 108, 81, .16); --accent-ink: #1a0f0b; --gold: #d8ab46; --good: #62c08a; --bad: #e77b66;
  --mat: #1f3327; --mat-hi: #294433; --mat-lo: #15241b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; width: 100%; max-width: 1280px; margin: 0 auto; padding-block: 10px 8px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .12em; margin: 0; line-height: 1; white-space: nowrap; }
.brand h1 small { font-size: .62em; letter-spacing: .08em; color: var(--accent); margin-right: .3em; }
.brand a { color: var(--muted); font-size: 11px; letter-spacing: .14em; white-space: nowrap; text-decoration: none; }
.brand a:hover { color: var(--accent); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1280px; margin: 0 auto; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }
.onbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.onbtn[data-st="on"] .dot { background: #2fb36a; opacity: 1; box-shadow: 0 0 0 3px rgba(47, 179, 106, .25); }
.onbtn[data-st="connecting"] .dot { background: var(--gold); opacity: 1; }
.onbtn small { font-weight: 500; color: var(--muted); }
.settings-wrap { position: relative; }
.popover { position: absolute; right: 0; top: 44px; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 10px; min-width: 250px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }
.hint { font-size: 12px; color: var(--muted); }

/* ---------- 対局画面 ---------- */
.play { flex: 1 1 auto; min-height: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
/* 卓 */
.table {
  position: relative; min-height: 0; border-radius: 16px; color: var(--mat-ink); overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, var(--mat-hi), var(--mat) 55%, var(--mat-lo)),
    var(--mat);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), inset 0 2px 18px rgba(0,0,0,.25), var(--shadow);
  display: grid; padding: 8px 10px; gap: 6px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto;
  grid-template-areas: "obar" "ocaps" "field" "info" "mcaps" "mbar" "hand";
}
/* 卓の織り目（ごく薄く） */
.table::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px), repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 5px); }
.table > * { position: relative; min-width: 0; }
.obar { grid-area: obar; }
.ocaps { grid-area: ocaps; }
.fieldwrap { grid-area: field; }
.info { grid-area: info; }
.mcaps { grid-area: mcaps; }
.handrow { grid-area: hand; }
.mbar { grid-area: mbar; min-height: 22px; }
/* 横長: 左に取り札、真ん中に相手の手札・場・情報・自分の手札 */
body.land .table {
  grid-template-columns: minmax(0, var(--capw, 34%)) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "ocaps obar" "ocaps field" "mbar info" "mcaps hand";
  column-gap: 12px;
}
body.land .mbar { align-self: end; }
body.land .ocaps { align-self: start; }
body.land .mcaps { align-self: end; }

/* 対局者の帯 */
.pbar { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; white-space: nowrap; }
.pbar .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pbar .oya { font: 800 11px/1 var(--font-display); background: var(--accent); color: #fff; border-radius: 5px; padding: 3px 4px 2px; letter-spacing: .05em; }
.pbar .tot { font-variant-numeric: tabular-nums; color: var(--mat-muted); }
.pbar .tot b { color: var(--mat-ink); font-size: 15px; font-family: var(--font-display); }
.pbar .koi { font: 700 10.5px/1.5 var(--font-body); color: #2a1e10; background: var(--sel); border-radius: 999px; padding: 0 7px; }
.pbar .think { font-size: 12px; color: var(--sel); display: inline-flex; align-items: center; gap: 6px; }
.pbar .think i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.pbar .aitag { margin-left: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.obar { display: flex; align-items: center; gap: 10px; }
.obar .pbar { flex: 1 1 auto; min-width: 0; }
.ohand { display: flex; align-items: center; flex: none; height: calc(var(--ow) * 1.6); }
.ohand .card { width: var(--ow); margin-left: calc(var(--ow) * -0.45); }
.ohand .card:first-child { margin-left: 0; }

/* 札 */
.card { position: relative; display: block; border: 0; padding: 0; background: none; width: var(--cw); aspect-ratio: 60 / 96; border-radius: calc(var(--cw) * .075); flex: none; cursor: default; }
.card svg.kc { display: block; width: 100%; height: 100%; border-radius: inherit; box-shadow: var(--card-shadow); }
.card.dim svg.kc { filter: brightness(.5) saturate(.6); }
.card.tap { cursor: pointer; }
.card.sel { transform: translateY(calc(var(--cw) * -0.16)); z-index: 3; }
.card.sel svg.kc { box-shadow: 0 0 0 2px var(--sel), 0 6px 14px rgba(0,0,0,.4); }
.card.match svg.kc { box-shadow: 0 0 0 2.5px var(--match), 0 0 14px 2px rgba(255, 224, 138, .55); }
.card.pickme { cursor: pointer; }
.card.last svg.kc { box-shadow: 0 0 0 2px rgba(255, 255, 255, .55), var(--card-shadow); }
.card .ai { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font: 700 9.5px/1.45 var(--font-body); color: #fff; background: var(--good); padding: 0 6px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.35); white-space: nowrap; z-index: 4; }
.card.hintflash svg.kc { animation: hintflash 1s ease-in-out 2; }
@keyframes hintflash { 50% { box-shadow: 0 0 0 3px #7be0a3, 0 0 18px 4px rgba(123, 224, 163, .7); } }
.card.on { position: absolute; z-index: 2; }

/* 取り札: 光・タネ・タン・カスの4つの山 */
.caps { display: flex; align-items: flex-end; gap: 6px; min-height: calc(var(--mw) * 1.6 + 18px); }
body.land .caps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; align-content: start; }
body.land.caps1 .caps { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 6px; }
body.land.caps1 .mcaps { align-content: flex-end; }
body.land.caps1 .caps .yaku { flex: 0 0 100%; }
body.land.caps1 .caps .cgroup { flex: 0 1 auto; }
body.land.caps1 .caps .cgroup.kasu { flex: 1 1 0; }
body.land .mcaps { align-content: end; }
.cgroup { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cgroup .lab { font-size: 10px; color: var(--mat-muted); letter-spacing: .08em; line-height: 1.2; white-space: nowrap; }
.cgroup .lab b { color: var(--mat-ink); font-weight: 700; margin-left: 2px; }
.cgroup .pile { display: flex; height: calc(var(--mw) * 1.6); }
.cgroup .pile .card { width: var(--mw); margin-left: calc(var(--mw) * var(--ov, -0.62)); }
.cgroup .pile .card:first-child { margin-left: 0; }
.cgroup.empty .pile { width: var(--mw); border: 1px dashed var(--mat-line); border-radius: 3px; }
.cgroup.kasu { flex: 1 1 auto; }
body.land .cgroup .pile { overflow: hidden; }
.yaku { display: flex; flex-wrap: wrap; gap: 3px 4px; align-content: flex-end; margin-left: auto; justify-content: flex-end; max-width: 46%; }
body.land .yaku { max-width: none; grid-column: 1 / -1; justify-content: flex-start; margin-left: 0; min-height: 18px; }
body.land .mcaps .yaku { order: -1; }
.ychip { font: 700 11px/1.5 var(--font-body); padding: 0 7px; border-radius: 999px; background: rgba(242, 193, 78, .92); color: #2a1e10; white-space: nowrap; }
.ychip.near { background: transparent; color: var(--mat-muted); border: 1px solid var(--mat-line); font-weight: 500; }
.ychip.sum { background: var(--accent); color: #fff; }

/* 場と山札 */
.fieldwrap { display: flex; align-items: center; justify-content: center; gap: calc(var(--fw) * .28); min-height: 0; }
.deck { position: relative; flex: none; width: var(--fw); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.deck .pile { position: relative; width: var(--fw); aspect-ratio: 60/96; }
.deck .pile .card { position: absolute; inset: 0; width: 100%; }
.deck .pile .card:nth-child(2) { transform: translate(-2px, -2px); }
.deck .pile .card:nth-child(3) { transform: translate(-4px, -4px); }
.deck .cnt { font-size: 11px; color: var(--mat-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.deck .mon { font: 800 13px/1 var(--font-display); letter-spacing: .1em; white-space: nowrap; }
.deck .float { position: absolute; left: -6%; top: 0; width: 112%; z-index: 6; }
.deck .float .card { width: 100%; }
.deck .float .card svg.kc { box-shadow: 0 0 0 2px var(--sel), 0 8px 18px rgba(0,0,0,.45); }
.field { display: grid; grid-template-columns: repeat(var(--fcols, 6), var(--fw)); grid-auto-rows: calc(var(--fw) * 1.6); gap: calc(var(--fw) * .14) calc(var(--fw) * .16); align-content: center; }
.slot { position: relative; width: var(--fw); height: calc(var(--fw) * 1.6); border-radius: calc(var(--fw) * .075); }
.slot .card { width: 100%; }
.slot.ghost { border: 1.5px dashed rgba(255, 224, 138, .8); background: rgba(255, 224, 138, .1); cursor: pointer; display: grid; place-items: center; font-size: 11px; color: var(--match); }
.slot .on { left: 22%; top: 16%; }
.fieldwrap.placeable .field { outline: 1.5px dashed rgba(255, 224, 138, .8); outline-offset: 6px; border-radius: 8px; cursor: pointer; }
.field .card { width: var(--fw); }

/* 自分の手札 */
.handrow { display: flex; justify-content: center; align-items: flex-end; padding-top: calc(var(--cw) * .18); }
.hand { display: flex; align-items: flex-end; }
.hand .card { margin-left: calc(var(--cw) * var(--hov, 0.06)); transition: transform .14s cubic-bezier(.2,.8,.2,1); }
.hand .card:first-child { margin-left: 0; }
.hand .card.tap:hover:not(.sel) { transform: translateY(calc(var(--cw) * -0.07)); }
.mbar { display: flex; align-items: center; gap: 8px; }

/* 情報の行（場のすぐ下、高さは固定） */
.info { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 4px 0 10px; border-radius: 10px; background: rgba(0, 0, 0, .22); font-size: 13px; white-space: nowrap; }
.info .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
.info .txt b { color: #fff; }
.info .muted { color: var(--mat-muted); font-size: 12px; }
.info .tools { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
.info .wp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mat-muted); cursor: pointer; border: 0; background: transparent; padding: 2px 4px; border-radius: 6px; }
.info .wp .bar { width: 46px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
.info .wp .bar i { display: block; height: 100%; background: #7be0a3; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.info .wp b { color: #c9f5d9; font-variant-numeric: tabular-nums; font-size: 13px; }
.info.alert { background: rgba(178, 60, 42, .5); }
.info.result { background: rgba(164, 124, 38, .55); }
.info.mine { background: rgba(0, 0, 0, .32); box-shadow: inset 0 0 0 1px rgba(242, 193, 78, .35); }
.info.view { background: rgba(40, 60, 110, .55); }
.info .mini { display: inline-flex; gap: 2px; vertical-align: middle; }
.info .mini .card { width: 14px; }
.mbtn[disabled] { opacity: .35; cursor: default; }
.mbtn { border: 1px solid rgba(243, 236, 220, .35); background: rgba(255,255,255,.08); color: var(--mat-ink); padding: 4px 11px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.mbtn:hover { background: rgba(255,255,255,.16); }
.mbtn.primary { background: var(--sel); border-color: var(--sel); color: #2a1e10; }
.mbtn.red { background: var(--accent); border-color: var(--accent); color: #fff; }

/* こいこい・役の演出（卓の上に重ねる） */
.stage { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.stage > * { pointer-events: auto; }
.yakuban { text-align: center; padding: 14px 22px 16px; border-radius: 16px; background: rgba(20, 16, 12, .78); backdrop-filter: blur(3px); box-shadow: 0 10px 40px rgba(0,0,0,.45); max-width: min(92%, 460px); }
.yakuban .who { font-size: 12px; color: var(--mat-muted); letter-spacing: .12em; }
.yakuban .names { font: 800 clamp(26px, 7vw, 44px)/1.15 var(--font-display); letter-spacing: .12em; color: #fff; margin: 4px 0 6px; text-shadow: 0 2px 10px rgba(242, 193, 78, .35); }
.yakuban .names span { display: inline-block; margin: 0 .2em; }
.yakuban .rule { height: 2px; margin: 0 auto 8px; width: 60%; background: linear-gradient(90deg, transparent, var(--sel), transparent); }
.yakuban .cards { display: flex; justify-content: center; gap: 4px; margin: 6px 0 8px; flex-wrap: wrap; }
.yakuban .cards .card { width: calc(var(--cw) * .8); }
.yakuban .pts { font-size: 14px; color: var(--mat-ink); }
.yakuban .pts b { font: 800 26px/1 var(--font-display); color: var(--sel); margin: 0 4px; }
.yakuban .choose { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.yakuban .choose button { min-width: 116px; min-height: 48px; border-radius: 12px; border: 0; cursor: pointer; font: 800 20px/1 var(--font-display); letter-spacing: .1em; display: grid; gap: 3px; justify-items: center; padding: 8px 14px; }
.yakuban .choose button small { font: 500 11px/1.2 var(--font-body); letter-spacing: 0; opacity: .85; }
.yakuban .choose .koi { background: var(--accent); color: #fff; }
.yakuban .choose .stop { background: var(--sel); color: #2a1e10; }
.yakuban .choose button.rec { box-shadow: 0 0 0 3px #7be0a3; }
.yakuban .advice { margin-top: 8px; font-size: 12px; color: #c9f5d9; }
.pop-in { animation: popin .32s cubic-bezier(.2,.9,.25,1.2); }
.oyakime .pair { display: flex; gap: 22px; justify-content: center; margin: 10px 0; }
.oyakime .oyak { display: grid; justify-items: center; gap: 4px; }
.oyakime .oyak .who { font-size: 12px; color: var(--mat-muted); }
.oyakime .oyak .card { width: calc(var(--cw) * 1.1); }
.oyakime .oyak .mon { font: 800 14px/1 var(--font-display); color: #fff; letter-spacing: .1em; }
@keyframes popin { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
.koicall { font: 800 clamp(34px, 10vw, 64px)/1 var(--font-display); color: #fff; letter-spacing: .14em; text-shadow: 0 3px 18px rgba(185, 65, 44, .8), 0 0 2px #000; animation: koicall 1.1s ease-out forwards; pointer-events: none; }
@keyframes koicall { 0% { opacity: 0; transform: scale(.6) rotate(-6deg); } 25% { opacity: 1; transform: scale(1.06) rotate(-3deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.12) rotate(-3deg); } }

/* 操作の列 */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 210px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
/* 横長: 操作は卓の右に縦に並べる */
body.land .play { grid-template-columns: minmax(0, 1fr) 168px; grid-template-rows: minmax(0, 1fr); }
body.land .controls { flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 6px; }
body.land .controls .btn { justify-content: center; }
body.land .controls .more-wrap { margin-left: 0; margin-top: auto; }
body.land .controls .more-wrap .btn { width: 100%; }
body.land .menu { bottom: 0; right: calc(100% + 6px); }
.side-score { display: none; }
body.land .side-score { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; min-height: 0; overflow: auto; }

/* 月ごとの得点の表 */
.months { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.months th, .months td { padding: 2px 4px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.months th { font-weight: 500; color: var(--muted); font-size: 11px; }
.months td.cur { background: var(--accent-soft); }
.months td.w { font-weight: 700; }
.months tr.sum td { border-bottom: 0; font-weight: 700; font-size: 13px; }

/* ---------- ダイアログ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 9, .5); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 22px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; }
.dialog h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 24px; letter-spacing: .06em; }
.field-row { display: grid; gap: 7px; margin-bottom: 15px; }
.field-row > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); padding: 6px 13px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface-2); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chips button[aria-pressed="true"] { background: color-mix(in srgb, var(--good) 16%, var(--surface)); border-color: var(--good); color: var(--ink); }
.chips button[aria-pressed="true"]::before { content: "✓ "; color: var(--good); font-weight: 700; }
.cards4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cards4 button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 10px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.cards4 button b { font-size: 15px; }
.cards4 button small { color: var(--muted); font-size: 11px; line-height: 1.45; }
.cards4 button .stars { color: var(--gold); letter-spacing: 2px; font-size: 12px; }
.cards4 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.result-title { font-family: var(--font-display); font-size: 32px; margin: 0; letter-spacing: .06em; }
.rlist { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; }
.rlist li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 10px; background: var(--surface-2); border-radius: 8px; }
.rlist li b { font-family: var(--font-display); }
.rlist li.mult { background: transparent; color: var(--muted); font-size: 13px; }
.rlist li.total { background: var(--accent-soft); font-weight: 700; }
.bigscore { display: flex; gap: 16px; align-items: baseline; justify-content: center; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.bigscore div { text-align: center; }
.bigscore b { display: block; font: 800 34px/1.1 var(--font-display); }
.bigscore span { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .overlay { padding: 10px; align-items: end; }
  .dialog { padding: 14px 15px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .dialog h2 { font-size: 20px; margin-bottom: 8px; }
  .field-row { margin-bottom: 10px; gap: 5px; }
  .seg button { padding: 5px 10px; font-size: 13px; }
  .chips button { padding: 4px 9px; font-size: 12px; }
  .cards4 { gap: 5px; }
  .cards4 button { padding: 7px 4px; text-align: center; border-radius: 10px; }
  .cards4 button b { font-size: 13px; }
  .cards4 button small { display: none; }
  .cards4 button .stars { letter-spacing: 0; font-size: 10px; }
}
/* オンライン */
.on-stats { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
.on-stats .stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.on-stats .stat span { color: var(--muted); font-size: 12px; }
.on-conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.on-conn[data-st="on"] { color: var(--good); }
.on-msg { margin: 0 0 10px; padding: 7px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; }
.on-list { display: grid; gap: 6px; max-height: 200px; overflow-y: auto; }
.on-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.on-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.on-ai, .on-wait { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.on-wait { flex-direction: column; align-items: flex-start; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; font-size: 16px; }
input.text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.aitag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.aitag.off { background: color-mix(in srgb, var(--good) 22%, transparent); color: #9fe0b8; }
.aitag.on { background: color-mix(in srgb, var(--gold) 34%, transparent); color: #ffe3a1; }
.dialog .aitag.off { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
.dialog .aitag.on { color: var(--gold); background: color-mix(in srgb, var(--gold) 22%, transparent); }
.row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .on-stats { gap: 14px; margin-bottom: 6px; }
  .on-stats .stat b { font-size: 22px; }
  .on-row { grid-template-columns: minmax(0, 1fr) auto; }
  .on-list { max-height: 24vh; }
  #dlg-online .field-row { margin-bottom: 8px; }
}

/* 記録（めくり・取りの流れ）と月ごとの得点: 下からせり上がるパネル */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-height: 62%; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 28px rgba(0,0,0,.2); padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s; display: flex; flex-direction: column; gap: 8px; }
.sheet.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: 1; }
.sheet-tabs button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
.sheet-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.sheet-body { overflow-y: auto; min-height: 0; }
.ibtn { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 2.2em auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 6px; border-radius: 7px; }
.log li .no { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
.log li .who { font-weight: 700; font-size: 12px; }
.log li.me .who { color: var(--accent); }
.log li .mini { display: inline-flex; gap: 2px; vertical-align: middle; margin: 0 2px; }
.log li .mini .card { width: 18px; }
.log li.ev { color: var(--muted); }
.log li[data-v] { cursor: pointer; }
.log li[data-v]:hover { background: var(--surface-2); }
.log li.cur { background: var(--accent-soft); }

/* ---------- ルール / AI（タブで1枚ずつ） ---------- */
.doc { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; max-width: 960px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
.doctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; flex: none; }
.doctabs::-webkit-scrollbar { display: none; }
.doctabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.doctabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.dcard h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 8px; letter-spacing: .04em; }
.dcard p, .dcard li { max-width: 72ch; }
.dcard p { margin: 6px 0; }
.dcard ul { margin: 6px 0; padding-left: 20px; }
.ytab { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.yrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.yrow b { font-family: var(--font-display); font-size: 16px; }
.yrow .p { font-weight: 700; color: var(--accent); white-space: nowrap; }
.yrow .cs { grid-column: 1 / -1; display: flex; gap: 3px; flex-wrap: wrap; }
.yrow .cs .card { width: 26px; }
.yrow small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }
.mtab { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mrow { display: grid; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.mrow b { font-family: var(--font-display); }
.mrow .cs { display: flex; gap: 3px; }
.mrow .cs .card { width: 28px; }
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.lv th, table.lv td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
.tbl { overflow-x: auto; }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
@media (max-width: 560px) {
  .dcard { padding: 10px 12px; }
  .dcard h3 { font-size: 17px; }
  .dcard p, .dcard li { font-size: 13px; line-height: 1.55; }
  .ytab { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .yrow { padding: 6px 8px; }
  .yrow .cs .card { width: 22px; }
}

@media (max-width: 560px) {
  .top { gap: 6px; padding-block: 7px 6px; }
  .brand h1 { font-size: 19px; letter-spacing: .04em; }
  .brand h1 small { display: block; font-size: 10px; letter-spacing: .3em; margin: 0 0 1px; }
  .brand a { display: none; }
  .tabs button { padding: 4px 9px; font-size: 13px; }
  .iconbtn { width: 34px; height: 34px; }
  .onbtn { height: 34px; padding: 0 9px; gap: 5px; font-size: 12px; }
  .onbtn .lbl { display: none; }
  .onbtn[data-st="off"] .cnt::before, .onbtn[data-st="error"] .cnt::before, .onbtn[data-st="unavailable"] .cnt::before { content: "対戦"; }
  .onbtn[data-st="on"] .cnt::before, .onbtn[data-st="connecting"] .cnt::before { content: "対戦 "; }
  .controls { gap: 6px; flex-wrap: nowrap; }
  .controls .btn { padding: 6px 10px; font-size: 13px; }
  .controls .wide { display: none; }
  .table { padding: 6px 7px; gap: 5px; border-radius: 12px; }
  .info { height: 36px; font-size: 12.5px; }
}
/* 横長の小さな画面（スマホを横に） */
body.land.short .top { padding-block: 4px 4px; }
body.land.short .brand h1 { font-size: 18px; }
body.land.short .brand a { display: none; }
body.land.short .tabs button { padding: 3px 9px; font-size: 12.5px; }
body.land.short .iconbtn, body.land.short .onbtn { height: 30px; }
body.land.short .iconbtn { width: 30px; }
body.land.short .table { padding: 5px 8px; gap: 4px; }
body.land.short .info { height: 32px; }
body.land.short .controls .btn { padding: 5px 8px; font-size: 12.5px; }
body.land.short .play { grid-template-columns: minmax(0, 1fr) 132px; gap: 6px; }
@media (prefers-reduced-motion: reduce) {
  .card, .hand .card, .info .wp .bar i { transition: none !important; }
  .pop-in, .koicall, .card.hintflash svg.kc { animation: none !important; }
  .pbar .think i { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1><small>花札</small>こいこい</h1><a href="../" title="チューリング・テーブル（ゲームの一覧）">チューリング・テーブル</a></div>
  <nav class="tabs" role="tablist" aria-label="ページ">
    <button role="tab" aria-selected="true" data-tab="play">対局</button>
    <button role="tab" aria-selected="false" data-tab="rules">ルール</button>
    <button role="tab" aria-selected="false" data-tab="ai">AI</button>
  </nav>
  <button class="onbtn" id="btn-online" data-st="off" title="オンライン対戦（いまオンラインの人数・対戦待ちの人数）"><span class="dot"></span><span class="lbl">オンライン</span><span class="cnt"></span></button>
  <div class="settings-wrap">
    <button class="iconbtn" id="btn-settings" aria-label="表示の設定" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <span class="hint" style="margin-bottom:-4px">AI補助（下の「AI補助」でまとめて切り替え）</span>
      <label class="switch"><input type="checkbox" id="set-wp" checked> 勝ちの見込みを表示</label>
      <label class="switch"><input type="checkbox" id="set-best" checked> おすすめの一手を表示</label>
      <span class="hint" style="margin-bottom:-4px">そのほか</span>
      <label class="switch"><input type="checkbox" id="set-tag" checked> 札に月と種類の印をつける</label>
      <label class="switch"><input type="checkbox" id="set-near" checked> もう少しでできる役を表示</label>
      <label class="switch"><input type="checkbox" id="set-sound" checked> 効果音</label>
      <label class="switch"><input type="checkbox" id="set-anim" checked> 札の動き</label>
      <label class="switch"><input type="checkbox" id="set-fast"> CPU を速く打たせる</label>
    </div>
  </div>
</header>

<main>
  <section id="view-play" class="play">
    <div class="table" id="table">
      <div class="obar"><div class="pbar" id="pbar-opp"></div><div class="ohand" id="ohand"></div></div>
      <div class="caps ocaps" id="caps-opp" aria-label="相手の取り札"></div>
      <div class="fieldwrap" id="fieldwrap">
        <div class="deck" id="deck"></div>
        <div class="field" id="field" aria-label="場"></div>
      </div>
      <div class="info" id="info" aria-live="polite"></div>
      <div class="caps mcaps" id="caps-me" aria-label="自分の取り札"></div>
      <div class="pbar mbar" id="pbar-me"></div>
      <div class="handrow"><div class="hand" id="hand" aria-label="自分の手札"></div></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="controls" id="controls">
      <button class="btn primary" id="btn-new">新しい対局</button>
      <button class="btn" id="btn-hint">ヒント</button>
      <button class="btn aibtn" id="btn-ai" aria-pressed="true" title="勝ちの見込みとおすすめの一手をまとめて出し入れ"><span class="led"></span>AI補助</button>
      <button class="btn wide" id="btn-log">記録</button>
      <div class="side-score" id="side-score"></div>
      <div class="more-wrap">
        <button class="btn" id="btn-more" aria-label="そのほかの操作" aria-expanded="false">⋯</button>
        <div class="menu" id="menu-more" hidden role="menu">
          <button role="menuitem" id="m-log">記録・月ごとの得点</button>
          <button role="menuitem" id="m-resign">この対局をやめる（投了）</button>
        </div>
      </div>
    </div>
  </section>
  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<!-- 記録・月ごとの得点 -->
<aside class="sheet" id="sheet" data-tab="log" aria-label="記録">
  <div class="sheet-head">
    <div class="sheet-tabs" role="tablist">
      <button role="tab" data-st="log" aria-selected="true">この月の流れ</button>
      <button role="tab" data-st="months" aria-selected="false">月ごとの得点</button>
    </div>
    <button class="ibtn" data-act="sheet-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<!-- 新しい対局 -->
<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field-row"><span class="lab">対局の種類</span><div class="seg" id="ng-mode"></div></div>
    <div class="field-row" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards4" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field-row"><span class="lab">何か月</span><div class="seg" id="ng-months"></div></div>
    <div class="field-row"><span class="lab">ルール（押して切り替え）</span><div class="chips" id="ng-rules"></div><span class="hint" id="ng-rules-hint"></span></div>
    <div class="actions">
      <button class="btn" id="ng-cancel">やめる</button>
      <button class="btn primary" id="ng-start">対局を始める</button>
    </div>
  </div>
</div>

<!-- 月の結果・対局の結果 -->
<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(460px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 2px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <div id="rs-body"></div>
    <div class="actions" id="rs-actions"></div>
  </div>
</div>

<!-- オンライン対戦（ロビー） -->
<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンライン対戦</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>
