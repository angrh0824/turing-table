<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヨット — チューリング・テーブル</title>
<meta name="description" content="昔から遊ばれてきたサイコロ遊び「ヨット」。ひとりで点数アタック、CPU や友だちと最大4人で">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 点数表が主役。その下に情報の行・サイコロの盆・操作。広い画面では右に「AI の読み」と「記録」。狭い画面では下からせり上がるパネル */
:root {
  --bg: #e4e9ec;
  --surface: #f7f6f1;
  --surface-2: #ebeeed;
  --surface-3: #dde3e4;
  --paper: #fbf9f1;
  --paper-line: #dcd6c4;
  --ink: #14202b;
  --muted: #5b6874;
  --line: #c6cfd4;
  --accent: #1f4f8f;
  --accent-soft: rgba(31, 79, 143, .13);
  --accent-ink: #ffffff;
  --gold: #a87717;
  --good: #23784a;
  --bad: #b23c2a;
  --felt: #1c5a56;
  --felt-hi: #24716b;
  --felt-lo: #123f3c;
  --rim: #6b4a22;
  --die: #fbf7ec;
  --die-lo: #ddd3bd;
  --pip: #1b1f24;
  --pip-one: #c8322a;
  --sel-ring: #ffd84a;
  --s0: #2b5fa8; --s1: #cf5636; --s2: #23887a; --s3: #b7841a;
  --shadow: 0 1px 2px rgba(20, 30, 40, .2), 0 8px 24px rgba(20, 30, 40, .12);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --surface: #161e24; --surface-2: #1e272e; --surface-3: #27323a; --paper: #1a2229; --paper-line: #2d3942;
    --ink: #e2e8ec; --muted: #94a2ad; --line: #2e3a43; --accent: #86a9e6; --accent-soft: rgba(134, 169, 230, .16); --accent-ink: #0c1422;
    --gold: #d9ac4c; --good: #5fc08a; --bad: #e77b66; --felt: #163f3c; --felt-hi: #1d504c; --felt-lo: #0d2b29; --rim: #4a3216;
    --s0: #6f9be0; --s1: #e47d5f; --s2: #4cbca9; --s3: #d9ac4c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #161e24; --surface-2: #1e272e; --surface-3: #27323a; --paper: #1a2229; --paper-line: #2d3942;
  --ink: #e2e8ec; --muted: #94a2ad; --line: #2e3a43; --accent: #86a9e6; --accent-soft: rgba(134, 169, 230, .16); --accent-ink: #0c1422;
  --gold: #d9ac4c; --good: #5fc08a; --bad: #e77b66; --felt: #163f3c; --felt-hi: #1d504c; --felt-lo: #0d2b29; --rim: #4a3216;
  --s0: #6f9be0; --s1: #e47d5f; --s2: #4cbca9; --s3: #d9ac4c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 12px 16px; width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 12px 10px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: .12em; margin: 0; line-height: 1; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 11px; letter-spacing: .18em; white-space: nowrap; }
.brand .home { align-self: center; color: var(--muted); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 2px 3px; border-radius: 6px; }
.brand .home:hover { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: none; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1240px; margin: 0 auto; flex: 1 1 auto; min-height: 0; overflow: hidden; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
main.scroll { overflow-y: auto; overscroll-behavior: contain; }

/* ---------- 対局画面 ---------- */
.play { display: grid; grid-template-columns: minmax(0, 580px) 360px; justify-content: center; gap: 22px; height: 100%; }
@media (max-width: 979px) { .play { grid-template-columns: minmax(0, 580px); } }
.table-col { display: flex; flex-direction: column; gap: 6px; min-height: 0; height: 100%; min-width: 0; }

/* 点数表 */
.sheet-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
.sheet {
  height: 100%; display: grid; grid-template-rows: minmax(30px, auto) repeat(14, minmax(0, 1fr));
  grid-template-columns: var(--labw, minmax(96px, 150px)) repeat(var(--np, 2), minmax(0, 1fr));
  background:
    linear-gradient(var(--paper), var(--paper));
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums;
}
.sheet > div, .sheet > button { min-width: 0; min-height: 0; border: 0; margin: 0; padding: 0 6px; background: transparent; display: flex; align-items: center; border-bottom: 1px solid var(--paper-line); }
.sheet .lab { gap: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; border-right: 1px solid var(--paper-line); padding-left: 10px; cursor: help; }
.sheet .lab .rule { margin-left: auto; color: var(--muted); font-size: 10.5px; font-weight: 400; }
.sheet .lab .mini { width: 17px; height: 17px; flex: none; }
.sheet .head { justify-content: center; gap: 5px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; border-bottom: 2px solid var(--paper-line); position: relative; }
.sheet .head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--sc); }
.sheet .head .nm { overflow: hidden; text-overflow: ellipsis; }
.sheet .head .aimark { flex: none; font-size: 9px; font-weight: 800; line-height: 1; padding: 2px 4px; border-radius: 999px; background: color-mix(in srgb, var(--gold) 26%, transparent); color: var(--gold); }
.sheet .head.turn { background: color-mix(in srgb, var(--sc) 16%, transparent); box-shadow: inset 0 -3px 0 var(--sc); }
.sheet .corner { border-bottom: 2px solid var(--paper-line); border-right: 1px solid var(--paper-line); color: var(--muted); font-size: 11px; letter-spacing: .08em; padding-left: 10px; }
.sheet .cell { justify-content: center; flex-direction: column; line-height: 1.05; font-size: 16px; font-weight: 700; position: relative; }
.sheet .cell.curcol { background: color-mix(in srgb, var(--sc) 7%, transparent); }
.sheet .cell .pv { color: var(--muted); font-weight: 500; opacity: .85; }
.sheet .cell .pv.zero { opacity: .45; }
.sheet .cell .ai { font-size: 9.5px; font-weight: 700; color: var(--good); margin-top: 1px; letter-spacing: .02em; }
.sheet .cell .ai.lo { color: var(--muted); font-weight: 500; }
.sheet button.cell { cursor: pointer; }
.sheet button.cell:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.sheet .cell.best::after { content: "★"; position: absolute; top: 1px; right: 3px; font-size: 10px; color: var(--good); }
.sheet .cell.pend { background: color-mix(in srgb, var(--accent) 20%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
.sheet .cell.pend .pv { color: var(--accent); opacity: 1; font-weight: 800; }
.sheet .cell.just { animation: just 1.4s ease-out; }
@keyframes just { 0% { background: color-mix(in srgb, var(--gold) 55%, transparent); } 100% { background: transparent; } }
.sheet .cell.zero-in { color: var(--muted); font-weight: 500; }
.sheet .sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.sheet .subrow { border-bottom: 2px solid var(--paper-line); background: color-mix(in srgb, var(--paper-line) 22%, transparent); }
.sheet .subrow.cell { font-size: 13px; }
.sheet .subrow .bn { font-size: 10px; font-weight: 700; color: var(--good); }
.sheet .subrow .pace { font-size: 10px; font-weight: 500; color: var(--muted); }
.sheet .subrow .pace.ok { color: var(--good); }
.sheet .subrow .pace.ng { color: var(--bad); }
.sheet .totrow { border-bottom: 0; background: color-mix(in srgb, var(--accent) 7%, transparent); }
.sheet .totrow.cell { font-size: 18px; font-weight: 800; }
.sheet .totrow.lead::before { content: "♛"; position: absolute; left: 4px; top: 50%; translate: 0 -50%; font-size: 12px; color: var(--gold); }
.sheet.view { outline: 2px dashed var(--gold); outline-offset: -2px; }

/* 情報の行（高さ固定） */
.info { flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; white-space: nowrap; overflow: hidden; }
.info .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.info .txt b { font-weight: 700; }
.info .ev { flex: none; font-size: 12px; font-weight: 700; color: var(--good); cursor: pointer; border: 0; background: color-mix(in srgb, var(--good) 12%, transparent); border-radius: 999px; padding: 3px 10px; }
.info .tools { display: flex; gap: 4px; flex: none; }
.info.alert { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.info.result { background: color-mix(in srgb, var(--gold) 18%, var(--surface)); }
.info.view { background: var(--surface-2); }

/* サイコロの盆 */
.tray {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px;
  background: radial-gradient(120% 140% at 50% 0%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));
  box-shadow: inset 0 0 0 3px var(--rim), inset 0 0 0 5px color-mix(in srgb, var(--rim) 40%, transparent), inset 0 6px 16px rgba(0,0,0,.35), var(--shadow);
}
.dice { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.die { position: relative; border: 0; padding: 0; background: none; cursor: pointer; aspect-ratio: 1 / 1; width: 100%; max-width: 64px; justify-self: center; transition: translate .16s cubic-bezier(.2,.8,.2,1); }
.die[disabled] { cursor: default; }
.die svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
.die .body { fill: var(--die); stroke: var(--die-lo); stroke-width: 2; }
.die .pip { fill: var(--pip); }
.die .pip.one { fill: var(--pip-one); }
.die.blank .body { fill: color-mix(in srgb, var(--die) 30%, transparent); stroke: color-mix(in srgb, var(--die) 45%, transparent); stroke-dasharray: 6 5; }
.die.held { translate: 0 -7px; }
.die.held svg { filter: drop-shadow(0 7px 4px rgba(0,0,0,.4)); }
.die.held .body { stroke: var(--sel-ring); stroke-width: 6; }
.die .tag { position: absolute; left: 50%; bottom: -15px; translate: -50% 0; font-size: 9.5px; font-weight: 700; color: var(--sel-ring); letter-spacing: .08em; white-space: nowrap; pointer-events: none; }
.die .rec { position: absolute; left: 50%; top: -9px; translate: -50% 0; width: 8px; height: 8px; border-radius: 50%; background: #6be39b; box-shadow: 0 0 0 2px rgba(0,0,0,.35); pointer-events: none; }
.die .rec.drop { background: transparent; box-shadow: inset 0 0 0 2px #ffb4a0; }
.die.rolling svg { animation: tumble var(--dur, .62s) cubic-bezier(.25,.6,.3,1); }
@keyframes tumble {
  0% { transform: translate(0, -22%) rotate(0deg) scale(.9); }
  30% { transform: translate(var(--jx, 8%), 6%) rotate(calc(var(--rot, 1) * 200deg)) scale(1.04); }
  60% { transform: translate(calc(var(--jx, 8%) * -.6), -6%) rotate(calc(var(--rot, 1) * 320deg)); }
  85% { transform: translate(0, 2%) rotate(calc(var(--rot, 1) * 352deg)); }
  100% { transform: translate(0, 0) rotate(calc(var(--rot, 1) * 360deg)); }
}
.dsvg { display: inline-block; vertical-align: middle; }
.dsvg .body { fill: var(--die); stroke: color-mix(in srgb, var(--die-lo) 70%, #000 30%); stroke-width: 5; }
.dsvg .pip { fill: var(--pip); }
.dsvg .pip.one { fill: var(--pip-one); }
.rollbtn {
  flex: none; display: grid; place-items: center; gap: 0; width: 96px; height: 62px; border-radius: 14px; border: 0; cursor: pointer;
  background: linear-gradient(180deg, #f6d27a, #d9a640); color: #3a2604; box-shadow: 0 3px 0 #8d6519, 0 6px 12px rgba(0,0,0,.3); font-weight: 800; font-size: 17px; line-height: 1.1; letter-spacing: .06em;
}
.rollbtn small { font-size: 11px; font-weight: 700; letter-spacing: 0; opacity: .8; }
.rollbtn:active:not([disabled]) { translate: 0 2px; box-shadow: 0 1px 0 #8d6519, 0 3px 8px rgba(0,0,0,.3); }
.rollbtn[disabled] { filter: grayscale(.7) brightness(.85); cursor: default; opacity: .75; }
.rollbtn.write { background: linear-gradient(180deg, #8fb8f2, #4f7fc6); color: #071a36; box-shadow: 0 3px 0 #27477a, 0 6px 12px rgba(0,0,0,.3); }

.controls { flex: none; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 200px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- AI の読み・記録（広い画面は右、狭い画面は下からせり上がる） ---------- */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.sheet-head { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { margin-left: auto; letter-spacing: 0; font-weight: 500; }
.evnum { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.evnum .v { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.evnum .lbl { color: var(--muted); font-size: 12px; font-weight: 700; }
.opts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
.opts li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 4px 8px; border-radius: 8px; }
.opts li.top { background: color-mix(in srgb, var(--good) 13%, transparent); font-weight: 700; }
.opts li.mine { box-shadow: inset 0 0 0 1.5px var(--accent); }
.opts .faces { display: inline-flex; gap: 2px; align-items: center; }
.opts .faces svg { width: 16px; height: 16px; }
.opts .v { color: var(--muted); font-size: 12px; }
.opts li.top .v { color: var(--good); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; overflow-y: auto; font-variant-numeric: tabular-nums; }
.log li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 7px; cursor: pointer; }
.log li:hover { background: var(--surface-2); }
.log li.cur { background: var(--accent-soft); }
.log .no { color: var(--muted); font-size: 10.5px; text-align: right; }
.log .who { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; white-space: nowrap; }
.log .who i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--sc); }
.log .faces { display: inline-flex; gap: 1px; }
.log .faces svg { width: 13px; height: 13px; }
.log .pt { font-weight: 700; text-align: right; white-space: nowrap; }
.log .bad { color: var(--bad); font-size: 10.5px; font-weight: 700; }
.meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
.hint { font-size: 12px; color: var(--muted); }
@media (min-width: 980px) {
  .side { height: 100%; overflow: hidden; }
  .side .logcard { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; overflow: hidden; }
  .side .logcard .log { flex: 1; }
  .sheetbtn { display: none !important; }
}
@media (max-width: 979px) {
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; top: var(--sheet-top, 42%); z-index: 60; gap: 8px;
    background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 28px rgba(0,0,0,.22);
    padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s;
  }
  .side.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .sheet-head { display: flex; align-items: center; gap: 8px; }
  .sheet-head::before { content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); }
  .sheet-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: 1; margin-top: 8px; }
  .sheet-tabs button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
  .sheet-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  .side .card { display: none !important; border: 0; padding: 0; background: transparent; }
  .side[data-tab="ev"] .evcard, .side[data-tab="log"] .logcard { display: flex !important; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
}
.ibtn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); flex: none; }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- ダイアログ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 16, .5); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; }
.dialog h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 24px; }
.field { display: grid; gap: 8px; margin-bottom: 16px; }
.field > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 14px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.cards button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.cards button b { font-size: 15px; }
.cards button small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.cards button .stars { color: var(--gold); letter-spacing: 2px; font-size: 12px; }
.cards button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.seatrows { display: grid; gap: 6px; }
.seatrow { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; align-items: center; }
.seatrow .hint { white-space: nowrap; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.result-title { font-family: var(--font-display); font-size: 32px; margin: 0; }
.rank { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.rank li { display: grid; grid-template-columns: 2.2em 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); }
.rank li.me { box-shadow: inset 0 0 0 1.5px var(--accent); }
.rank .pl { font-weight: 800; color: var(--muted); }
.rank i { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); }
.rank b { font-size: 18px; }
@media (max-width: 560px) {
  .overlay { padding: 10px; align-items: end; }
  .dialog { padding: 16px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .dialog h2 { font-size: 20px; margin-bottom: 10px; }
  .field { margin-bottom: 11px; gap: 6px; }
  .seg { gap: 4px; }
  .seg button { padding: 6px 10px; font-size: 13px; }
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .cards button { padding: 7px 2px; text-align: center; border-radius: 10px; }
  .cards button b { font-size: 13px; white-space: nowrap; }
  .cards button small { display: none; }
  .cards button .stars { letter-spacing: 0; font-size: 10px; }
}
/* オンライン */
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }
.onbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.onbtn[data-st="on"] .dot { background: #2fb36a; opacity: 1; box-shadow: 0 0 0 3px rgba(47, 179, 106, .25); }
.onbtn[data-st="connecting"] .dot { background: var(--gold); opacity: 1; }
.onbtn small { font-weight: 500; color: var(--muted); }
.on-stats { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
.on-stats .stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.on-stats .stat span { color: var(--muted); font-size: 12px; }
.on-conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.on-conn[data-st="on"] { color: var(--good); }
.on-msg { margin: 0 0 12px; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; }
.on-list { display: grid; gap: 6px; max-height: 200px; overflow-y: auto; }
.on-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.on-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seats { display: grid; gap: 4px; }
.seats .st { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 5px 10px; border-radius: 9px; background: var(--surface-2); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; font-size: 16px; }
input.text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.aitag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.aitag.off { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.aitag.on { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold); }
.popover { position: absolute; right: 0; top: 44px; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 10px; min-width: 240px; }
.settings-wrap { position: relative; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 90; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; max-width: calc(100vw - 40px); text-align: center; }

/* ---------- ルール / AI（タブで1枚ずつ） ---------- */
.doc { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; align-content: start; padding-bottom: 16px; }
.doctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
.doctabs::-webkit-scrollbar { display: none; }
.doctabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.doctabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.doc h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 6px; }
.doc .card p, .doc .card li { max-width: 72ch; }
.doc .card ul, .doc .card ol { padding-left: 20px; margin: 6px 0; }
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.catgrid > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); align-items: center; }
.catgrid b { font-size: 14px; }
.catgrid .pts { font-weight: 800; color: var(--accent); white-space: nowrap; }
.catgrid .ex { grid-column: 1 / -1; display: flex; gap: 3px; align-items: center; font-size: 12px; color: var(--muted); }
.catgrid .ex svg { width: 20px; height: 20px; }
.catgrid .ex { white-space: nowrap; }
@media (max-width: 560px) {
  .catgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .catgrid > div { padding: 6px 8px; grid-template-columns: minmax(0, 1fr); gap: 1px; }
  .catgrid b { font-size: 13px; }
  .catgrid .pts { font-size: 11px; }
  .catgrid .ex svg { width: 14px; height: 14px; }
  .catgrid .ex { gap: 2px; font-size: 11px; }
  .catgrid .hint { display: none; }
}
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.lv th, table.lv td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
.tbl { overflow-x: auto; }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.doc a { color: var(--accent); }

/* ---------- 狭い画面 ---------- */
@media (max-width: 560px) {
  .top { gap: 6px; padding-block: 8px 6px; }
  .brand h1 { font-size: 22px; letter-spacing: .06em; }
  .brand span { display: none; }
  .tabs button { padding: 5px 9px; font-size: 13px; }
  .iconbtn { width: 34px; height: 34px; }
  .onbtn { height: 34px; padding: 0 9px; gap: 5px; font-size: 12px; }
  .onbtn .cnt small { display: none; }
  .sheet { --labw: minmax(84px, 112px); }
  .sheet .lab { font-size: 12px; padding-left: 7px; gap: 5px; }
  .sheet .lab .rule { display: none; }
  .sheet .cell { font-size: 15px; }
  .sheet .totrow.cell { font-size: 16px; }
  .sheet .head { font-size: 11px; gap: 3px; padding: 0 3px; }
  .info { height: 38px; font-size: 12.5px; }
  .tray { padding: 9px 10px 13px; gap: 8px; }
  .dice { gap: 6px; }
  .rollbtn { width: 82px; height: 56px; font-size: 15px; }
  .controls { gap: 6px; }
  .controls .btn { padding: 6px 10px; font-size: 13px; }
  .doc .card { padding: 10px 12px; }
  .doc h3 { font-size: 17px; }
  .doc .card p, .doc .card li { font-size: 13px; line-height: 1.55; }
}
@media (max-width: 400px) {
  .top { gap: 5px; }
  .brand { gap: 4px; }
  .brand h1 { font-size: 20px; letter-spacing: .02em; }
  .brand .home { font-size: 22px; }
  .tabs button { padding: 5px 7px; font-size: 12.5px; }
  .onbtn { padding: 0 8px; font-size: 11.5px; gap: 4px; }
  .iconbtn { width: 32px; height: 32px; }
  .controls .wide { display: none; }
}
/* 横向きの低い画面: 左に点数表、右にサイコロと操作 */
@media (max-height: 520px) and (orientation: landscape) {
  .top { padding-block: 6px 4px; }
  .brand h1 { font-size: 20px; }
  .brand span { display: none; }
  .table-col { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 6px 12px; }
  .sheet-wrap { grid-column: 1; grid-row: 1 / -1; }
  .info { grid-column: 2; grid-row: 1; }
  .tray { grid-column: 2; grid-row: 2; }
  .controls { grid-column: 2; grid-row: 4; flex-wrap: wrap; }
  .sheet { grid-template-rows: minmax(22px, auto) repeat(14, minmax(0, 1fr)); }
  .sheet .cell { font-size: 13px; }
  .sheet .cell .ai { display: none; }
  .sheet .lab { font-size: 11.5px; }
  .play { grid-template-columns: minmax(0, 900px); }
}
@media (prefers-reduced-motion: reduce) {
  .die, .side, .die.rolling svg { transition: none; animation: none !important; }
  .sheet .cell.just { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a class="home" href="../" title="チューリング・テーブル（ゲームの一覧）" aria-label="チューリング・テーブル（ゲームの一覧）へ">‹</a><h1>ヨット</h1><span>YACHT · DICE</span></div>
  <nav class="tabs" role="tablist" aria-label="ページ">
    <button role="tab" aria-selected="true" data-tab="play">対局</button>
    <button role="tab" aria-selected="false" data-tab="rules">遊び方</button>
    <button role="tab" aria-selected="false" data-tab="ai">AI</button>
  </nav>
  <button class="onbtn" id="btn-online" data-st="off" title="オンラインの卓（いまオンラインの人数・空き席のある卓の人数）"><span class="dot"></span><span class="lbl">オンライン</span><span class="cnt"></span></button>
  <div class="settings-wrap">
    <button class="iconbtn" id="btn-settings" aria-label="設定" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <span class="hint" style="margin-bottom:-4px">AI補助（下の「AI補助」でまとめて切り替え）</span>
      <label class="switch"><input type="checkbox" id="set-values" checked> 期待の点数・勝つ確率を表示</label>
      <label class="switch"><input type="checkbox" id="set-best" checked> おすすめ（残す目・★の役）を表示</label>
      <span class="hint" style="margin-bottom:-4px">そのほか</span>
      <label class="switch"><input type="checkbox" id="set-sound" checked> 音</label>
      <label class="switch"><input type="checkbox" id="set-anim" checked> サイコロを転がす動き</label>
      <label class="switch"><input type="checkbox" id="set-fast"> CPU をすばやく</label>
      <label class="switch"><input type="checkbox" id="set-confirm" checked> 役は2回タップで記入（1回目は確認）</label>
    </div>
  </div>
</header>

<main id="main">
  <section id="view-play" class="play">
    <div class="table-col">
      <div class="sheet-wrap"><div class="sheet" id="sheet" role="grid" aria-label="点数表"></div></div>
      <div class="info" id="info" aria-live="polite"></div>
      <div class="tray">
        <div class="dice" id="dice" aria-label="サイコロ（タップで残す）"></div>
        <button class="rollbtn" id="btn-roll">振る<small>あと3回</small></button>
      </div>
      <div class="controls">
        <button class="btn primary" id="btn-new">新しい対局</button>
        <button class="btn" id="btn-hint">ヒント</button>
        <button class="btn aibtn" id="btn-ai" aria-pressed="true" title="期待の点数・勝つ確率とおすすめをまとめて出し入れ"><span class="led"></span>AI補助</button>
        <button class="btn sheetbtn wide" id="btn-panel" title="AI の読み・記録">読み・記録</button>
        <div class="more-wrap">
          <button class="btn" id="btn-more" aria-label="そのほかの操作" aria-expanded="false">⋯</button>
          <div class="menu" id="menu-more" hidden role="menu">
            <button role="menuitem" id="btn-undo">待った（直前の記入を取り消す）</button>
            <button role="menuitem" id="btn-panel2">AI の読み・記録</button>
            <button role="menuitem" id="btn-resign">この対局をやめる</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="side" id="side" data-tab="ev" aria-label="AI の読みと記録">
      <div class="sheet-head">
        <div class="sheet-tabs" role="tablist">
          <button role="tab" data-st="ev" aria-selected="true">AI の読み</button>
          <button role="tab" data-st="log" aria-selected="false">記録</button>
        </div>
        <button class="ibtn" data-act="sheet-close" aria-label="閉じる" style="margin-top:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="card evcard" id="evcard"></div>
      <div class="card logcard">
        <h2>記録<span class="grow" id="log-info"></span></h2>
        <ol class="log" id="log"></ol>
      </div>
    </aside>
  </section>

  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<!-- 新しい対局 -->
<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field"><span class="lab">遊び方</span><div class="seg" id="ng-mode"></div><span class="hint" id="ng-mode-hint"></span></div>
    <div class="field" id="ng-n-field"><span class="lab">人数</span><div class="seg" id="ng-n"></div></div>
    <div class="field" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field" id="ng-order-field"><span class="lab">あなたの順番</span><div class="seg" id="ng-order"></div></div>
    <div class="field" id="ng-watch-field"><span class="lab">観戦するCPU</span><div class="seatrows" id="ng-watch"></div></div>
    <div class="actions">
      <button class="btn" id="ng-cancel">やめる</button>
      <button class="btn primary" id="ng-start">対局を始める</button>
    </div>
  </div>
</div>

<!-- 終わり -->
<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(460px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 4px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <ol class="rank" id="rs-rank"></ol>
    <p id="rs-body" class="hint" style="margin:0 0 14px"></p>
    <div class="actions">
      <button class="btn" id="rs-review">点数表を見る</button>
      <button class="btn" id="rs-new">設定を変える</button>
      <button class="btn primary" id="rs-again">もう一局</button>
    </div>
  </div>
</div>

<!-- オンラインの卓 -->
<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンラインの卓</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="../common/mute.js"></script>
<script src="js/yacht-core.js"></script>
<script src="js/yacht-ai.js"></script>
<script src="js/table.js"></script>
<script src="js/weights.js" onerror="window.YACHT_WEIGHTS_MISSING = true"></script>
<script src="js/strength.js" onerror="window.YACHT_STRENGTH_MISSING = true"></script>
<script src="../common/online.js"></script>
<script src="js/app.js"></script>
<script src="js/online-table.js"></script>
</body>
</html>
