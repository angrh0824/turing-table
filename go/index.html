<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>囲碁 — チューリング・テーブル</title>
<meta name="description" content="自己対局だけで強くなった自作の AI と、榧の碁盤で打つ囲碁（9路・13路・19路）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 配置: 盤が主役。盤の上下に対局者（アゲハマ・考え中）、盤のすぐ下に情報の行・形勢の行・棋譜テープ。広い画面では右に形勢・グラフ・棋譜。狭い画面では下からせり上がるパネル */
:root {
  --bg: #efe9dd;
  --surface: #faf7f0;
  --surface-2: #f1ece1;
  --surface-3: #e5ded0;
  --ink: #211c16;
  --muted: #6d6457;
  --line: #d3cab9;
  --accent: #1f6a58;
  --accent-soft: rgba(31, 106, 88, .13);
  --accent-ink: #ffffff;
  --gold: #a5761c;
  --good: #23784f;
  --bad: #b8402a;
  --shu: #c9452c;
  --kaya: #e2b765;
  --kaya-hi: #ecc87e;
  --kaya-lo: #cf9f4b;
  --kaya-edge: #a97a35;
  --grid: #2b1f10;
  --stone-b: #141516;
  --stone-w: #f7f4ec;
  --cand: 31, 106, 88;
  --shadow: 0 1px 2px rgba(40, 28, 10, .22), 0 10px 28px rgba(40, 28, 10, .16);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --surface: #1e1b16; --surface-2: #27231c; --surface-3: #312c23; --ink: #ece5d8; --muted: #a59b8a; --line: #3a342a;
    --accent: #5fbf9f; --accent-soft: rgba(95, 191, 159, .15); --accent-ink: #0d1a15; --gold: #d9ab4a; --good: #63c18d; --bad: #ec7d66; --shu: #e8644a;
    --kaya: #c99b4f; --kaya-hi: #d4a95e; --kaya-lo: #b3853c; --kaya-edge: #8a5f25; --grid: #261a0b; --cand: 95, 191, 159;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --surface: #1e1b16; --surface-2: #27231c; --surface-3: #312c23; --ink: #ece5d8; --muted: #a59b8a; --line: #3a342a;
  --accent: #5fbf9f; --accent-soft: rgba(95, 191, 159, .15); --accent-ink: #0d1a15; --gold: #d9ab4a; --good: #63c18d; --bad: #ec7d66; --shu: #e8644a;
  --kaya: #c99b4f; --kaya-hi: #d4a95e; --kaya-lo: #b3853c; --kaya-edge: #8a5f25; --grid: #261a0b; --cand: 95, 191, 159;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 14px 12px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .14em; margin: 0; line-height: 1; }
.brand span { color: var(--muted); font-size: 11px; letter-spacing: .18em; }
.brand .home { align-self: center; color: var(--muted); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 2px 3px; border-radius: 6px; }
.brand .home:hover, .brand .home:focus-visible { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { white-space: nowrap; border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1240px; margin: 0 auto; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 10px; }

/* ---------- 対局画面 ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
@media (max-width: 980px) { .play { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: center; }
.board-col > * { width: 100%; max-width: var(--board-w, min(640px, max(320px, calc(100vh - 330px)))); }

/* 対局者カード */
.player {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; min-height: 48px;
  transition: border-color .2s, box-shadow .2s;
}
.player.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.player .id { display: flex; align-items: center; gap: 8px; min-width: 0; }
.player .stone { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.stone.b { background: radial-gradient(circle at 34% 30%, #6d7176, #2a2c2f 38%, #0d0e0f 72%); box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.stone.w { background: radial-gradient(circle at 34% 30%, #ffffff, #f2eee4 48%, #cfc8b8 100%); box-shadow: 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 .5px rgba(0,0,0,.12); }
.player .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .st { display: flex; align-items: center; gap: 10px; justify-self: end; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.player .st b { color: var(--ink); font-size: 14px; }
.player .think { color: var(--accent); display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.player .think i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 碁盤 */
.board-row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.evalbar { position: relative; border-radius: 7px; overflow: hidden; background: var(--stone-w); border: 1px solid var(--line); }
.evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--stone-b); transition: height .45s cubic-bezier(.2,.8,.2,1); }
.evalbar.flip .fill { top: 0; bottom: auto; }
.evalbar .mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--gold); opacity: .8; }
@media (max-width: 979px) { .board-row { grid-template-columns: minmax(0, 1fr); } .evalbar { display: none; } }
.eval-off .board-row { grid-template-columns: minmax(0, 1fr); }
.eval-off .evalbar { display: none; }
.board-wrap { position: relative; }
.goban {
  position: relative; border-radius: 6px; box-shadow: var(--shadow), inset 0 0 0 1px rgba(80, 50, 10, .25);
  background:
    radial-gradient(ellipse 120% 60% at 30% 20%, rgba(255, 236, 190, .28), transparent 60%),
    linear-gradient(160deg, var(--kaya-hi), var(--kaya) 45%, var(--kaya-lo));
  aspect-ratio: 1 / 1; width: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
.goban svg.board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.goban svg.board text { font-family: var(--font-body); font-weight: 700; }
/* 盤の目・石の印など（SVG） */
.g-line { stroke: var(--grid); }
.g-coord { fill: color-mix(in srgb, var(--grid) 72%, transparent); }
.g-star { fill: var(--grid); }
.mk-last { fill: none; stroke: var(--shu); }
.mk-ko { fill: none; stroke: var(--shu); stroke-dasharray: 6 5; }
.cand circle { stroke: rgba(255,255,255,.75); }
.cand text { fill: #fff; text-anchor: middle; dominant-baseline: central; }
.pend-ring { fill: none; stroke: var(--accent); animation: pend 1s ease-in-out infinite alternate; }
.pend-line { stroke: var(--accent); opacity: .55; }
@keyframes pend { from { opacity: 1; } to { opacity: .35; } }
.dead-x { stroke: var(--shu); stroke-linecap: round; }
/* 拡大鏡（タッチで指の上に出る） */
.loupe { position: fixed; z-index: 90; width: 124px; height: 124px; border-radius: 50%; pointer-events: none; overflow: hidden;
  box-shadow: 0 8px 22px rgba(0,0,0,.35), 0 0 0 3px var(--surface), 0 0 0 4px var(--line);
  background: linear-gradient(160deg, var(--kaya-hi), var(--kaya) 45%, var(--kaya-lo)); }
.loupe svg { width: 100%; height: 100%; display: block; }
.loupe .lp-name { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; font: 700 12px/1 var(--font-body); color: #2a1d0c; text-shadow: 0 0 3px rgba(255,240,210,.9); }

/* 盤の下: 情報の行（高さ固定。盤が動かないように）・形勢の行・棋譜テープ */
.boardfoot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sqinfo { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 12px; font-size: 13px; white-space: nowrap; }
.sqinfo .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sqinfo .muted { color: var(--muted); font-size: 12px; }
.sqinfo .tools { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
.sqinfo .tools .btn.small { padding: 5px 11px; white-space: nowrap; }
.sqinfo.alert { background: color-mix(in srgb, var(--bad) 13%, transparent); }
.sqinfo.alert .txt { color: var(--bad); font-weight: 700; }
.sqinfo.result { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.sqinfo.confirm { background: var(--accent-soft); }
.sqinfo.mark { background: color-mix(in srgb, var(--shu) 10%, transparent); }
.sqinfo.view { background: var(--surface-2); }
.ibtn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navrow { display: flex; align-items: center; gap: 2px; padding: 3px 4px; border-top: 1px solid var(--line); }
.navrow .ibtn { width: 38px; height: 34px; flex: none; color: var(--ink); }
@media (min-width: 980px) { .navrow .sheet-btn { display: none; } }
.navrow .ibtn[disabled] { opacity: .28; cursor: default; background: transparent; }
.tape { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.tape::-webkit-scrollbar { display: none; }
.tape button { flex: none; border: 0; background: transparent; border-radius: 7px; padding: 5px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.tape button:hover { background: var(--surface-2); }
.tape button .no { color: var(--muted); font-size: 10px; }
.tape button .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.tape button .dot.b { background: var(--stone-b); }
.tape button .dot.w { background: var(--stone-w); box-shadow: inset 0 0 0 1px #9d9583; }
.tape button.cur { background: var(--accent); color: var(--accent-ink); }
.tape button.cur .no { color: inherit; opacity: .8; }
.tape button.bad { color: var(--bad); }
.tape button.cur.bad { color: var(--accent-ink); }
.evstrip { display: none; grid-template-columns: 64px auto minmax(0, auto) minmax(0, 1fr); align-items: center; gap: 4px 10px; padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.evstrip .bar { height: 8px; border-radius: 999px; background: var(--stone-w); border: 1px solid var(--line); overflow: hidden; }
.evstrip .bar .b { height: 100%; background: var(--stone-b); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.evstrip .num { font: 800 17px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.evstrip .lbl { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.evstrip .best { font-size: 12px; color: var(--good); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
@media (max-width: 979px) { .evstrip { display: grid; } }
.eval-off .evstrip, .eval-off .evcard, .eval-off .graph { display: none !important; }
.evoff-card { display: none; }
.eval-off .evoff-card { display: flex; align-items: center; gap: 10px; }
@media (max-width: 979px) { .eval-off .evoff-card { display: none; } }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls.in-side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.controls.in-side .menu { bottom: auto; top: calc(100% + 6px); }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 210px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
.menu .narrow-only { display: none; }
@media (max-width: 560px) { .menu .narrow-only { display: block; } }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); font-weight: 700; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- 形勢パネル ---------- */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sheet-head { display: none; }
@media (max-width: 979px) {
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; top: var(--sheet-top, 45%); z-index: 60; gap: 8px;
    background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 28px rgba(0,0,0,.2);
    padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s;
  }
  .side.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .sheet-head { display: flex; align-items: center; gap: 8px; }
  .sheet-head::before { content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); }
  .sheet-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: 1; margin-top: 8px; }
  .sheet-tabs button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; }
  .sheet-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  .side .card { display: none !important; border: 0; padding: 0; background: transparent; }
  .side[data-tab="ev"] .evcard, .side[data-tab="graph"] .graph { display: block !important; flex: 1; min-height: 0; overflow-y: auto; }
  .side[data-tab="kifu"] .kifucard { display: flex !important; flex-direction: column; flex: 1; min-height: 0; }
  .side .kifucard .kifu { flex: 1; max-height: none; min-height: 0; }
  .side .graph svg { height: calc(100% - 26px); min-height: 90px; }
  .eval-off .sheet-tabs [data-st="ev"], .eval-off .sheet-tabs [data-st="graph"] { display: none; }
}
@media (min-width: 980px) {
  .side { position: sticky; top: 8px; max-height: calc(100dvh - 84px); }
  .side .kifucard { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; overflow: hidden; }
  .side .kifucard .kifu { flex: 1 1 auto; max-height: none; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { margin-left: auto; letter-spacing: 0; font-weight: 500; }
.evalnum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.evalnum .v { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.evalnum .lbl { color: var(--muted); font-weight: 700; }
.wr { margin-top: 10px; }
.wr-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--stone-w); border: 1px solid var(--line); }
.wr-bar .b { background: var(--stone-b); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.wr-text { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--muted); }
.cands { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cands li { display: grid; grid-template-columns: 1.6em 3.2em 4.4em 4.6em minmax(0, 1fr); gap: 6px; align-items: center; padding: 3px 6px; border-radius: 7px; }
.cands li.best { background: var(--accent-soft); font-weight: 700; }
.cands li .pv { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cands li .rank { color: var(--muted); font-size: 11px; text-align: right; }
.meta { color: var(--muted); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.graph svg { width: 100%; height: 130px; display: block; cursor: pointer; }
.graph .axis { stroke: var(--line); }
.graph .mid { stroke: var(--muted); stroke-dasharray: 3 3; opacity: .6; }
.graph .areab { fill: color-mix(in srgb, var(--ink) 18%, transparent); }
.graph .lineb { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.graph .now { stroke: var(--accent); stroke-width: 1.5; }
.graph .dot { fill: var(--accent); }
.graph text { fill: var(--muted); font-size: 9px; }
.kifu { position: relative; max-height: 300px; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: 13px; font-variant-numeric: tabular-nums; }
.kifu li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 6px; padding: 3px 8px; border-radius: 7px; cursor: pointer; }
.kifu li:hover { background: var(--surface-2); }
.kifu li.cur { background: var(--accent-soft); }
.kifu .no { color: var(--muted); text-align: right; }
.kifu .ev { color: var(--muted); font-size: 11px; }
.kifu .ev.bad { color: var(--bad); }
.row-actions { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* ---------- ダイアログ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 8, 5, .5); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; width: min(640px, 100%); max-height: 100%; overflow-y: auto; }
.dialog h2 { margin: 0 0 16px; font-family: var(--font-display); font-size: 24px; }
.field { display: grid; gap: 8px; margin-bottom: 16px; }
.field > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 14px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.cards button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.cards button b { font-size: 15px; }
.cards button small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.cards button .stars { color: var(--gold); letter-spacing: 2px; font-size: 12px; }
.cards button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .overlay { padding: 10px; align-items: end; }
  .dialog { padding: 16px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-radius: 16px; max-height: 100%; }
  .dialog h2 { font-size: 20px; margin-bottom: 10px; }
  .field { margin-bottom: 11px; gap: 6px; }
  .seg { gap: 4px; }
  .seg button { padding: 6px 10px; font-size: 13px; }
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .cards button { padding: 7px 4px; text-align: center; border-radius: 10px; }
  .cards button b { font-size: 13px; }
  .cards button small { display: none; }
  .cards button .stars { letter-spacing: 0; font-size: 10px; }
  .on-stats { gap: 16px; margin-bottom: 6px; }
  .on-stats .stat b { font-size: 24px; }
  .on-stats .stat span { font-size: 11px; }
  #dlg-online .field { margin-bottom: 9px; }
  #dlg-online .on-note { font-size: 10.5px; margin: 0; }
  .on-msg { margin-bottom: 8px; padding: 6px 10px; }
  .on-ai .hint { display: none; }
  .on-list { max-height: 24vh; }
}
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.dialog textarea { width: 100%; min-height: 160px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.result-title { font-family: var(--font-display); font-size: 34px; margin: 0; }
.count-row { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0 14px; font-variant-numeric: tabular-nums; }
.count-row div { display: flex; align-items: center; gap: 8px; }
.count-row b { font-family: var(--font-display); font-size: 24px; }
/* オンライン */
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; }
.onbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.onbtn[data-st="on"] .dot { background: #2fb36a; opacity: 1; box-shadow: 0 0 0 3px rgba(47, 179, 106, .25); }
.onbtn[data-st="connecting"] .dot { background: var(--gold); opacity: 1; }
.onbtn small { font-weight: 500; color: var(--muted); }
.on-stats { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
.on-stats .stat b { display: block; font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.on-stats .stat span { color: var(--muted); font-size: 12px; }
.on-conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.on-conn[data-st="on"] { color: var(--good); }
.on-msg { margin: 0 0 12px; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; }
.on-list { display: grid; gap: 6px; max-height: 220px; overflow-y: auto; }
.on-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.on-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.on-ai, .on-wait { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.on-wait { flex-direction: column; align-items: flex-start; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; font-size: 16px; }
input.text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.aitag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.aitag.off { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.aitag.on { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold); }
.popover { position: absolute; right: 0; top: 44px; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 10px; min-width: 250px; }
.settings-wrap { position: relative; }

/* ---------- ルール / AI（タブで1枚ずつ） ---------- */
.doc { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; align-content: start; }
.doctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
.doctabs::-webkit-scrollbar { display: none; }
.doctabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.doctabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.doc .card p, .doc .card li { max-width: 70ch; }
.doc h3 { font-family: var(--font-display); font-size: 21px; margin: 0 0 8px; }
.doc .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 10px; }
.doc .fig { display: grid; gap: 4px; }
.doc .fig svg { width: 100%; max-width: 200px; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.doc .fig span { font-size: 12px; color: var(--muted); }
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; }
table.lv th, table.lv td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
.stat-row { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.doc a { color: var(--accent); }
@media (max-width: 560px) {
  .doc { gap: 10px; }
  main { padding-bottom: 4px; }
  .doc .card { padding: 10px 12px; }
  .doc h3 { font-size: 16px; margin-bottom: 4px; }
  .doc .card ul { padding-left: 18px; margin: 4px 0; }
  .doc .card li { font-size: 12.5px; line-height: 1.5; margin-bottom: 2px; }
  .doc .card p { font-size: 12.5px; line-height: 1.5; margin: 5px 0; }
  .doc .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  .doc .fig span { font-size: 10.5px; line-height: 1.35; }
  .wide-only { display: none !important; }
  .doc .stat-row { gap: 14px; }
  .doc .stat b { font-size: 22px; }
}
@media (max-width: 560px) {
  .top { flex-wrap: nowrap; gap: 8px; padding-block: 8px 8px; }
  .brand h1 { font-size: 22px; letter-spacing: .08em; }
  .brand span { display: none; }
  .tabs button { padding: 5px 10px; font-size: 13px; }
  .iconbtn { width: 34px; height: 34px; flex: none; }
  .onbtn { height: 34px; padding: 0 9px; gap: 5px; font-size: 12px; }
  .onbtn .lw, .onbtn small { display: none; } /* 狭い画面: 「● 対戦 3人」（「対戦」は必ず出す） */
  .brand { gap: 6px; }
  .on-row { grid-template-columns: minmax(0, 1fr) auto; }
  .on-row .hint { grid-column: 1; }
  .play { gap: 14px; }
  .board-col { gap: 6px; }
  .player { padding: 4px 10px; min-height: 40px; }
  .player .sub { display: none; }
  .controls { gap: 6px; flex-wrap: nowrap; }
  .controls .btn { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  .controls .more-wrap { margin-left: 0; }
  .controls .wide { display: none; }
  .navrow .ibtn { width: 34px; }
  .sqinfo { height: 40px; font-size: 12.5px; }
}
/* 横長の小さな画面（スマホ横）: 盤を左、ほかを右に */
@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  .top { padding-block: 6px 6px; }
  .brand h1 { font-size: 20px; }
  .brand span { display: none; }
  .play { grid-template-columns: minmax(0, 1fr); }
  .board-col { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto; column-gap: 14px; row-gap: 6px; align-items: start; }
  .board-col > * { max-width: none; }
  .board-col .board-row { grid-column: 1; grid-row: 1 / 6; width: var(--board-w, 300px); }
  .board-col > :not(.board-row) { grid-column: 2; }
  .evstrip { display: grid; }
  .player { min-height: 38px; padding: 3px 10px; }
  .player .sub { display: none; }
  .controls { flex-wrap: wrap; gap: 6px; }
  .controls .btn { padding: 5px 10px; font-size: 13px; }
  .sqinfo { height: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  .wr-bar .b, .evalbar .fill, .player, .evstrip .bar .b { transition: none; }
  .pend-ring { animation: none; }
  .player .think i { animation: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a class="home" href="../" title="チューリング・テーブル（ゲームの一覧）" aria-label="チューリング・テーブル（ゲームの一覧）へ">‹</a><h1>囲碁</h1><span>GO · 中国ルール</span></div>
  <nav class="tabs" role="tablist" aria-label="ページ">
    <button role="tab" id="tab-play" aria-selected="true" data-tab="play">対局</button>
    <button role="tab" id="tab-rules" aria-selected="false" data-tab="rules">ルール</button>
    <button role="tab" id="tab-ai" aria-selected="false" data-tab="ai">AI</button>
  </nav>
  <button class="onbtn" id="btn-online" data-st="off" title="オンライン対戦（いまオンラインの人数・対戦待ちの人数）"><span class="dot"></span><span class="lbl">オンライン</span><span class="cnt"></span></button>
  <div class="settings-wrap">
    <button class="iconbtn" id="btn-settings" aria-label="表示の設定" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <span class="hint" style="margin-bottom:-4px">AI補助（下の「AI補助」でまとめて切り替え）</span>
      <label class="switch"><input type="checkbox" id="set-eval" checked> 形勢（勝率・目数・グラフ）</label>
      <label class="switch"><input type="checkbox" id="set-cands" checked> 最善手の候補を盤に</label>
      <label class="switch"><input type="checkbox" id="set-own"> 地の見込みを盤に</label>
      <span class="hint" style="margin-bottom:-4px">そのほか</span>
      <label class="switch"><input type="checkbox" id="set-confirm" checked> タッチでは打つ前に確かめる</label>
      <label class="switch"><input type="checkbox" id="set-coords" checked> 座標</label>
      <label class="switch"><input type="checkbox" id="set-sound" checked> 石の音</label>
      <label class="switch"><input type="checkbox" id="set-analyze" checked> 自分の手番で形勢を読む</label>
      <label class="switch"><input type="checkbox" id="set-resign" checked> CPU は大差なら投了する</label>
    </div>
  </div>
</header>

<main>
  <section id="view-play" class="play">
    <div class="board-col">
      <div class="player" id="player-top"></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar" aria-hidden="true"><div class="fill" id="evalbar-fill" style="height:50%"></div><div class="mid"></div></div>
        <div class="board-wrap" id="board-wrap">
          <div class="goban" id="goban"><svg class="board" id="board" role="img" aria-label="碁盤"></svg></div>
        </div>
      </div>
      <div class="boardfoot">
        <div class="sqinfo" id="sqinfo" aria-live="polite"></div>
        <div class="evstrip" id="evstrip" role="button" tabindex="0" aria-label="形勢。押すと候補手と読み筋を表示">
          <div class="bar"><div class="b" id="evs-b" style="width:50%"></div></div>
          <span class="num" id="evs-num">—</span>
          <span class="lbl" id="evs-lbl"></span>
          <span class="best" id="evs-best"></span>
        </div>
        <div class="navrow" id="navrow">
          <button class="ibtn" data-nav="first" aria-label="最初の局面"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
          <button class="ibtn" data-nav="prev" aria-label="1手戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <div class="tape" id="tape" aria-label="棋譜"></div>
          <button class="ibtn" data-nav="next" aria-label="1手進む"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ibtn" data-nav="last" aria-label="最新の局面"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
          <button class="ibtn sheet-btn" data-nav="sheet" aria-label="形勢・グラフ・棋譜を開く" title="形勢・グラフ・棋譜"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
        </div>
      </div>
      <div class="player" id="player-bottom"></div>
      <div class="controls">
        <button class="btn primary" id="btn-new">新しい対局</button>
        <button class="btn" id="btn-pass">パス</button>
        <button class="btn wide" id="btn-undo">待った</button>
        <button class="btn" id="btn-hint">ヒント</button>
        <button class="btn aibtn" id="btn-ai" aria-pressed="true" title="形勢と最善手の候補をまとめて出し入れ"><span class="led"></span>AI補助</button>
        <div class="more-wrap">
          <button class="btn" id="btn-more" aria-label="そのほかの操作" aria-expanded="false">⋯</button>
          <div class="menu" id="menu-more" hidden role="menu">
            <button role="menuitem" id="btn-undo2" class="narrow-only">待った</button>
            <button role="menuitem" id="btn-resign">投了する</button>
            <button role="menuitem" id="btn-ownmenu">地の見込みを盤に出す</button>
            <button role="menuitem" id="btn-panel">形勢・グラフ・棋譜</button>
            <button role="menuitem" id="btn-sgf-out">棋譜を書き出す（SGF）</button>
            <button role="menuitem" id="btn-sgf-in">棋譜を読み込む（SGF）</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="side" id="side" data-tab="kifu" aria-label="形勢と棋譜">
      <div class="sheet-head">
        <div class="sheet-tabs" role="tablist">
          <button role="tab" data-st="ev" aria-selected="false">形勢</button>
          <button role="tab" data-st="graph" aria-selected="false">グラフ</button>
          <button role="tab" data-st="kifu" aria-selected="true">棋譜</button>
        </div>
        <button class="ibtn" data-act="sheet-close" aria-label="閉じる" style="margin-top:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="card evoff-card">
        <span class="hint" style="flex:1">形勢は隠しています</span>
        <button class="btn small" data-act="show-eval">表示する</button>
      </div>
      <div class="card evcard">
        <h2>形勢<span class="grow" id="ev-who"></span></h2>
        <div class="evalnum"><span class="v" id="ev-num">—</span><span class="lbl" id="ev-label"></span></div>
        <div class="wr">
          <div class="wr-bar"><div class="b" id="wr-b" style="width:50%"></div></div>
          <div class="wr-text"><span id="wr-bt">黒 50%</span><span id="wr-wt">白 50%</span></div>
        </div>
        <ol class="cands" id="cands"></ol>
        <div class="meta" id="ev-meta"></div>
      </div>
      <div class="card graph">
        <h2>形勢グラフ<span class="grow">黒の勝率</span></h2>
        <svg id="graph" viewBox="0 0 300 130" preserveAspectRatio="none" role="img" aria-label="手数ごとの黒の勝率。クリックでその局面へ"></svg>
      </div>
      <div class="card kifucard">
        <h2>棋譜<span class="grow" id="kifu-info"></span></h2>
        <ol class="kifu" id="kifu"></ol>
        <div class="row-actions" id="viewing" hidden>
          <span id="viewing-text"></span>
          <button class="btn small" id="btn-live">最新の局面へ</button>
          <button class="btn small" id="btn-branch">ここから打ち直す</button>
        </div>
        <div class="row-actions">
          <button class="btn small" id="btn-copy">SGF をコピー</button>
          <button class="btn small" id="btn-import">SGF を読み込む</button>
          <span id="copy-msg"></span>
        </div>
      </div>
    </aside>
  </section>

  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<!-- 新しい対局 -->
<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field"><span class="lab">対局の種類</span><div class="seg" id="ng-mode"></div></div>
    <div class="field" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field" id="ng-side-field"><span class="lab">あなたの石</span><div class="seg" id="ng-side"></div></div>
    <div class="field" id="ng-watch-field"><span class="lab">観戦するCPU</span>
      <div class="hint">黒</div><div class="seg" id="ng-cpu-b"></div>
      <div class="hint">白</div><div class="seg" id="ng-cpu-w"></div>
    </div>
    <div class="field"><span class="lab">碁盤</span><div class="seg" id="ng-size"></div><span class="hint" id="ng-size-hint"></span></div>
    <div class="field"><span class="lab">置き石（ハンデ）</span><div class="seg" id="ng-ha"></div><span class="hint" id="ng-ha-hint"></span></div>
    <div class="actions">
      <button class="btn" id="ng-cancel">やめる</button>
      <button class="btn primary" id="ng-start">対局を始める</button>
    </div>
  </div>
</div>

<!-- 終局 -->
<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(460px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 4px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <div class="count-row" id="rs-count"></div>
    <p id="rs-body" style="margin:0 0 16px"></p>
    <div class="actions">
      <button class="btn" id="rs-review">振り返る</button>
      <button class="btn" id="rs-new">設定を変える</button>
      <button class="btn primary" id="rs-again">もう一局</button>
    </div>
  </div>
</div>

<!-- オンライン対戦（ロビー） -->
<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンライン対戦</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>

<!-- SGF -->
<div class="overlay" id="dlg-sgf" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sg-title">
    <h2 id="sg-title">棋譜（SGF）</h2>
    <p class="hint" id="sg-hint"></p>
    <textarea id="sg-text" aria-label="SGF" spellcheck="false"></textarea>
    <p class="hint" id="sg-msg"></p>
    <div class="actions">
      <label class="btn" id="sg-file-lab">ファイルを選ぶ<input type="file" id="sg-file" accept=".sgf,text/plain" hidden></label>
      <button class="btn" id="sg-save">ファイルに保存</button>
      <button class="btn" id="sg-cancel">閉じる</button>
      <button class="btn primary" id="sg-ok">読み込む</button>
    </div>
  </div>
</div>

<script src="js/go-nn.js"></script>
<script src="js/go-search.js"></script>
<script src="js/go-wasm.js"></script>

</body>
