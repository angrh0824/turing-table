<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>軍人将棋 — チューリング・テーブル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900&text=大将中少佐尉飛行機タンク騎兵工スパイ地雷軍旗司令部勝負相打審&display=swap">
<style>
/* 地図の紙の上に陣地。盤は横6×縦8、真ん中に川と突入口の橋2つ、奥の中央に司令部。駒は自分のぶんだけ表、相手の駒は裏 */
:root {
  --bg: #e7e1d1; --surface: #f6f2e7; --surface-2: #ece6d6; --surface-3: #e0d8c4;
  --ink: #221f18; --muted: #6a6352; --line: #cdc4ad;
  --accent: #2c4a7a; --accent-soft: rgba(44, 74, 122, .13); --accent-ink: #fff;
  --red: #b2412a; --gold: #a07a22; --good: #2f7a4a; --bad: #b2412a;
  --map: #efe6cc; --map-2: #e4d8b6; --map-line: #9c8a5e; --map-ink: #5d4f2e;
  --river: #9fb5bf; --river-2: #87a1ad; --bridge: #8a6a3e; --hq: rgba(178, 65, 42, .10); --hq-line: #b2412a;
  --pc-b: #efd8a6; --pc-b-hi: #f8e8c6; --pc-b-lo: #d9b979; --pc-b-ink: #1d150b; --pc-b-edge: #9a7337;
  --pc-w: #6e4a2c; --pc-w-hi: #8a603b; --pc-w-lo: #52361e; --pc-w-ink: #f4e7cc; --pc-w-edge: #3a2513;
  --hl-sel: rgba(44, 74, 122, .28); --hl-last: rgba(196, 140, 20, .30); --hl-from: rgba(196, 140, 20, .14);
  --sel-ring: #1f5fe6;
  --shadow: 0 1px 2px rgba(30, 25, 15, .22), 0 8px 24px rgba(30, 25, 15, .12);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-koma: "Zen Old Mincho", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
  --radius: 12px; --rv: .46fr;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121310; --surface: #1b1c17; --surface-2: #23241e; --surface-3: #2c2d26; --ink: #e8e3d4; --muted: #a29b88; --line: #34352c;
    --accent: #8eaae0; --accent-soft: rgba(142, 170, 224, .15); --accent-ink: #0d1320; --red: #e2775c; --gold: #d6ab4a; --good: #67c08c; --bad: #e2775c;
    --map: #3a3526; --map-2: #322d20; --map-line: #6f6342; --map-ink: #c9b98c; --river: #3d5560; --river-2: #334953; --bridge: #6e5430; --hq: rgba(226, 119, 92, .12); --hq-line: #d9775a;
    --hl-sel: rgba(142, 170, 224, .30); --sel-ring: #4b84ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121310; --surface: #1b1c17; --surface-2: #23241e; --surface-3: #2c2d26; --ink: #e8e3d4; --muted: #a29b88; --line: #34352c;
  --accent: #8eaae0; --accent-soft: rgba(142, 170, 224, .15); --accent-ink: #0d1320; --red: #e2775c; --gold: #d6ab4a; --good: #67c08c; --bad: #e2775c;
  --map: #3a3526; --map-2: #322d20; --map-line: #6f6342; --map-ink: #c9b98c; --river: #3d5560; --river-2: #334953; --bridge: #6e5430; --hq: rgba(226, 119, 92, .12); --hq-line: #d9775a;
  --hl-sel: rgba(142, 170, 224, .30); --sel-ring: #4b84ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; width: 100%; max-width: 1240px; margin: 0 auto; padding-block: 14px 12px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: .08em; margin: 0; line-height: 1; white-space: nowrap; }
.brand span { color: var(--muted); font-size: 11px; letter-spacing: .18em; white-space: nowrap; }
.brand .home { align-self: center; color: var(--muted); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 2px 3px; border-radius: 6px; }
.brand .home:hover { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1240px; margin: 0 auto; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 10px; }

/* ---------- 対局画面 ---------- */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
@media (max-width: 979px) { .play { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: center; }
.board-col > * { width: 100%; max-width: var(--board-w, 460px); }
@media (min-width: 980px) { .board-col > :not(.board-wrap) { max-width: max(var(--board-w, 460px), 450px); } }

.player { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; min-height: 42px; transition: border-color .2s, box-shadow .2s; }
.player.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.player .mk { font-size: 15px; line-height: 1; flex: none; }
.player .mk.b { color: #b98a3a; } .player .mk.w { color: #6e4a2c; }
.player .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 4em; flex: 0 1 auto; }
.player .think { font-size: 12px; color: var(--accent); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.player .think i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.player .st { margin-left: auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; flex: 1 1 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
.player .st b { color: var(--ink); font-variant-numeric: tabular-nums; }
.player .lost { display: flex; gap: 2px; overflow: hidden; min-width: 0; flex: 0 1 auto; justify-content: flex-end; }
.mini { display: inline-grid; place-items: center; height: 20px; min-width: 20px; padding: 0 3px; border-radius: 4px; font: 900 11px/1 var(--font-koma); flex: none; letter-spacing: -.02em; }
.mini.b { background: var(--pc-b); color: var(--pc-b-ink); border: 1px solid var(--pc-b-edge); }
.mini.w { background: var(--pc-w); color: var(--pc-w-ink); border: 1px solid var(--pc-w-edge); }
.mini.x { opacity: .5; text-decoration: line-through; }

/* 盤 */
.board-wrap { position: relative; }
.board-frame {
  position: relative; border-radius: 10px; padding: 18px 22px 18px 18px; box-shadow: var(--shadow);
  background: repeating-linear-gradient(0deg, rgba(120, 100, 50, .05) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(120, 100, 50, .05) 0 1px, transparent 1px 22px), radial-gradient(ellipse at 30% 20%, var(--map), var(--map-2));
}
.grid {
  position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)) minmax(0, var(--rv)) repeat(4, minmax(0, 1fr));
  aspect-ratio: 6 / 8.46; width: 100%; border: 2px solid var(--map-line); background: transparent;
}
.coords-top, .coords-right { position: absolute; color: var(--map-ink); font-size: 10px; font-weight: 700; opacity: .7; pointer-events: none; }
.coords-top { left: 18px; right: 22px; top: 2px; display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; }
.coords-right { top: 18px; bottom: 18px; right: 6px; display: grid; grid-template-rows: repeat(4, 1fr) var(--rv) repeat(4, 1fr); align-items: center; }
.river { grid-column: 1 / -1; grid-row: 5; position: relative; background: linear-gradient(180deg, var(--river-2), var(--river) 50%, var(--river-2)); border-top: 1px solid var(--map-line); border-bottom: 1px solid var(--map-line); }
.river::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(255,255,255,.18) 14px 20px, transparent 20px 34px); opacity: .7; mask: linear-gradient(180deg, transparent 30%, #000 45% 55%, transparent 70%); }
.bridge { position: absolute; top: -3px; bottom: -3px; width: calc(100% / 6 * .62); margin-left: calc(100% / 6 * .19); background: repeating-linear-gradient(90deg, var(--bridge) 0 3px, color-mix(in srgb, var(--bridge) 70%, #000) 3px 4px); border-left: 2px solid color-mix(in srgb, var(--bridge) 60%, #000); border-right: 2px solid color-mix(in srgb, var(--bridge) 60%, #000); border-radius: 2px; z-index: 1; }
.sq { position: relative; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; min-width: 0; min-height: 0; display: grid; place-items: center; outline-offset: -2px;
  box-shadow: inset -1px -1px 0 color-mix(in srgb, var(--map-line) 55%, transparent); touch-action: none; -webkit-tap-highlight-color: transparent; }
.sq.entry { background: color-mix(in srgb, var(--bridge) 13%, transparent); }
.sq.hq { background: var(--hq); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--hq-line) 55%, transparent), inset 0 0 0 4px var(--map), inset 0 0 0 5px color-mix(in srgb, var(--hq-line) 35%, transparent); }
.sq.hq .hqlab { position: absolute; inset: auto 0 2px; text-align: center; font: 900 9px/1 var(--font-koma); letter-spacing: .5em; color: var(--hq-line); opacity: .65; pointer-events: none; }
.sq.camp-b::before, .sq.camp-w::before { content: none; }
.sq.last { background: var(--hl-last); } .sq.from { background: var(--hl-from); }
.sq.selected { background: var(--hl-sel); }
.sq .mark { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; z-index: 4; }
.sq .mark.move::after { content: ""; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(24, 48, 110, .62); box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.sq .mark.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 10px; border: 3px solid var(--red); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7); }
.sq .mark.dim { background: rgba(30, 24, 12, .34); }
.sq .mark.swap::after { content: ""; position: absolute; inset: 6%; border-radius: 8px; border: 2px dashed var(--accent); }
.sq .mark.hint::after { content: ""; position: absolute; inset: 4%; border-radius: 9px; border: 3px solid var(--good); }
.sq .mark.pend::after { content: ""; position: absolute; inset: 2%; border: 3px solid var(--sel-ring); border-radius: 6px; animation: pend 1s ease-in-out infinite alternate; }
@keyframes pend { from { opacity: 1; } to { opacity: .35; } }

/* 駒（五角形）。自分の駒は字、相手の駒は裏（字なし） */
.pc { position: relative; width: 86%; height: 92%; display: block; pointer-events: none; transition: translate .16s cubic-bezier(.2,.8,.2,1), scale .14s; }
.sq.hq .pc { width: 43%; }
.pc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pc .ch { font-family: var(--font-koma); font-weight: 900; text-anchor: middle; dominant-baseline: central; }
.pc .guess { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); font: 900 12px/1.05 var(--font-koma); color: var(--pc-w-ink); text-align: center; white-space: nowrap; opacity: .9; text-shadow: 0 0 3px rgba(0,0,0,.5); }
.pc.side-b .guess { color: var(--pc-b-ink); text-shadow: 0 0 3px rgba(255,255,255,.6); }
.pc .guess small { display: block; font: 700 9px/1.1 var(--font-body); opacity: .85; }
.pc .pm { position: absolute; top: 9%; width: 6px; height: 6px; border-radius: 50%; }
.pc .pm.mv { left: 18%; background: #4f8a5a; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
.pc .pm.won { right: 18%; background: var(--red); box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
.pc.revealed svg { filter: drop-shadow(0 0 2px var(--red)); }
.sq.selected .pc { translate: 0 -7%; scale: 1.07; }
.sq.selected .pc::after { content: ""; position: absolute; inset: -4% -2%; border-radius: 8px; outline: 3px solid var(--sel-ring); outline-offset: 1px; }
.sq.inspect .pc::after { content: ""; position: absolute; inset: -4% -2%; border-radius: 8px; outline: 3px dashed var(--red); outline-offset: 1px; }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; opacity: .92; transform: translate(-50%, -60%) scale(1.12); filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
.moving { z-index: 30; position: relative; }

/* 審判の判定（はんこ） */
.stamp { position: absolute; z-index: 20; pointer-events: none; display: grid; place-items: center; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 3px solid var(--red); border-radius: 50%; color: var(--red); background: color-mix(in srgb, var(--surface) 82%, transparent);
  font: 900 20px/1 var(--font-koma); letter-spacing: -.04em; transform: rotate(-12deg) scale(.4); opacity: 0; animation: stamp 1.5s cubic-bezier(.2,.8,.2,1) forwards; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--surface) 80%, transparent), inset 0 0 0 4px var(--red); }
.stamp.lose { color: #4a5b78; border-color: #4a5b78; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--surface) 80%, transparent), inset 0 0 0 4px #4a5b78; }
.stamp.tie { color: var(--gold); border-color: var(--gold); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--surface) 80%, transparent), inset 0 0 0 4px var(--gold); font-size: 17px; }
@keyframes stamp { 0% { opacity: 0; transform: rotate(-12deg) scale(1.6); } 14% { opacity: 1; transform: rotate(-12deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: rotate(-12deg) scale(1); } }
.arrows { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: visible; }
.arrows .ar { stroke: rgba(46, 140, 80, .85); fill: rgba(46, 140, 80, .85); }

/* 目隠し（ふたりで交代で遊ぶとき） */
.curtain { position: absolute; inset: 0; z-index: 40; border-radius: 10px; display: grid; place-items: center; text-align: center; padding: 20px; cursor: pointer;
  background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 88%, #000) 0 12px, var(--accent) 12px 24px); color: var(--accent-ink); }
.curtain b { display: block; font: 800 24px/1.3 var(--font-display); margin-bottom: 6px; }

/* 盤の下: 情報の行・形勢の行・棋譜テープ */
.boardfoot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sqinfo { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; font-size: 13px; white-space: nowrap; }
.sqinfo .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sqinfo .muted { color: var(--muted); font-size: 12px; }
.sqinfo .tools { margin-left: auto; display: flex; gap: 4px; flex: none; align-items: center; }
.sqinfo.alert { background: color-mix(in srgb, var(--bad) 13%, transparent); }
.sqinfo.alert .txt { color: var(--bad); font-weight: 700; }
.sqinfo.result { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.sqinfo.setup { background: var(--accent-soft); }
.sqinfo.view { background: var(--surface-2); }
.sqinfo .gs { display: inline-flex; gap: 6px; }
.sqinfo .gs span { font-size: 12px; } .sqinfo .gs b { font-family: var(--font-koma); font-weight: 900; }
.ibtn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.ibtn:hover { background: var(--surface-2); color: var(--ink); }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navrow { display: flex; align-items: center; gap: 2px; padding: 3px 4px; border-top: 1px solid var(--line); }
.navrow .ibtn { width: 38px; height: 34px; flex: none; color: var(--ink); }
.navrow .ibtn[disabled] { opacity: .28; cursor: default; background: transparent; }
@media (min-width: 980px) { .navrow .sheet-btn { display: none; } }
.tape { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.tape::-webkit-scrollbar { display: none; }
.tape button { flex: none; border: 0; background: transparent; border-radius: 7px; padding: 5px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.tape button:hover { background: var(--surface-2); }
.tape button .no { color: var(--muted); font-size: 10px; margin-right: 3px; }
.tape button .r { margin-left: 3px; font-weight: 700; color: var(--red); }
.tape button.cur { background: var(--accent); color: var(--accent-ink); }
.tape button.cur .no, .tape button.cur .r { color: inherit; opacity: .85; }
.evstrip { display: none; grid-template-columns: 64px auto minmax(0, 1fr); align-items: center; gap: 4px 10px; padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.evstrip .bar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--bad) 35%, var(--surface-2)); overflow: hidden; }
.evstrip .bar .b { height: 100%; background: var(--good); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.evstrip .num { font: 800 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.evstrip .best { font-size: 12px; color: var(--good); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
@media (max-width: 979px) { .evstrip { display: grid; } }
.eval-off .evstrip, .eval-off .evcard, .eval-off .graph, .eval-off .estcard { display: none !important; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 210px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- 横のパネル（狭い画面では下からせり上がる） ---------- */

    padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }

.row-actions { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* ---------- ダイアログ ---------- */

/* オンライン */
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }

</header>

<main>
  <section id="view-play" class="play">
    <div class="board-col">
      <div class="player" id="player-top"></div>
      <div class="board-wrap" id="board-wrap">
        <div class="board-frame" id="board-frame">
          <div class="coords-top" id="coords-top"></div>
          <div class="coords-right" id="coords-right"></div>
          <div class="grid" id="grid" role="grid" aria-label="軍人将棋の盤"></div>
          <svg class="arrows" id="arrows" aria-hidden="true"></svg>
        </div>
        <div class="curtain" id="curtain" hidden role="button" tabindex="0"></div>
      </div>
      <div class="boardfoot">
        <div class="sqinfo" id="sqinfo" aria-live="polite"></div>
        <div class="evstrip" id="evstrip" role="button" tabindex="0" aria-label="形勢。押すと詳しく">
          <div class="bar"><div class="b" id="evs-b" style="width:50%"></div></div>
          <span class="num" id="evs-num">—</span>
          <span class="best" id="evs-best"></span>
        </div>
        <div class="navrow" id="navrow">
          <button class="ibtn" data-nav="first" aria-label="最初の局面"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
          <button class="ibtn" data-nav="prev" aria-label="1手戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <div class="tape" id="tape" aria-label="棋譜"></div>
          <button class="ibtn" data-nav="next" aria-label="1手進む"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ibtn" data-nav="last" aria-label="最新の局面"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
          <button class="ibtn sheet-btn" data-nav="sheet" aria-label="形勢・推定・棋譜を開く"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
        </div>
      </div>
      <div class="player" id="player-bottom"></div>
      <div class="controls" id="controls"></div>
    </div>

    <aside class="side" id="side" data-tab="ev" aria-label="形勢・推定・棋譜">
      <div class="sheet-head">
        <div class="sheet-tabs" role="tablist">
          <button role="tab" data-st="ev" aria-selected="true">形勢</button>
          <button role="tab" data-st="est" aria-selected="false">相手の駒</button>
          <button role="tab" data-st="kifu" aria-selected="false">棋譜</button>
        </div>
        <button class="ibtn" data-act="sheet-close" aria-label="閉じる" style="margin-top:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="card evcard">
        <h2>形勢<span class="grow" id="ev-who"></span></h2>
        <div class="evalnum"><span class="v" id="ev-num">—</span><span class="lbl" id="ev-label"></span></div>
        <div class="wr-bar"><div class="b" id="wr-b" style="width:50%"></div></div>
        <ul class="cands" id="cands"></ul>
        <div class="meta" id="ev-meta"></div>
      </div>
      <div class="card graph">
        <h2>勝率の流れ<span class="grow" id="graph-who"></span></h2>
        <svg id="graph" viewBox="0 0 300 110" preserveAspectRatio="none" role="img" aria-label="手数ごとの勝率。クリックでその局面へ"></svg>
      </div>
      <div class="card estcard">
        <h2>相手の駒の内訳<span class="grow" id="est-who"></span></h2>
        <div id="est"></div>
      </div>
      <div class="card kifucard">
        <h2>棋譜<span class="grow" id="kifu-info"></span></h2>
        <ol class="kifu" id="kifu"></ol>
        <div class="row-actions" id="viewing" hidden><span id="viewing-text"></span><button class="btn small" id="btn-live">最新の局面へ</button></div>
      </div>
    </aside>
  </section>

  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field"><span class="lab">対局の種類</span><div class="seg" id="ng-mode"></div><span class="hint" id="ng-mode-hint"></span></div>
    <div class="field" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field" id="ng-side-field"><span class="lab">あなたの手番</span><div class="seg" id="ng-side"></div></div>
    <div class="field" id="ng-watch-field"><span class="lab">観戦するCPU</span>
      <div class="hint">先手</div><div class="seg" id="ng-cpu-b"></div>
      <div class="hint">後手</div><div class="seg" id="ng-cpu-w"></div>
    </div>
    <div class="actions"><button class="btn" id="ng-cancel">やめる</button><button class="btn primary" id="ng-start">対局を始める</button></div>
  </div>
</div>

<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(460px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 4px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <p id="rs-body" style="margin:6px 0 12px"></p>
    <p class="verify" id="rs-verify" hidden></p>
    <div class="actions">
      <button class="btn" id="rs-review">盤を見返す</button>
      <button class="btn" id="rs-new">設定を変える</button>
      <button class="btn primary" id="rs-again">もう一局</button>
    </div>
  </div>
</div>

<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンライン対戦</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>

<script src="../common/mute.js"></script>
<script src="js/gunjin-core.js"></script>
<script src="js/gunjin-ai.js"></script>
<script src="js/gunjin-net.js"></script>
<script src="js/weights.js" onerror="window.GUNJIN_WEIGHTS_MISSING = true"></script>
<script src="js/strength.js" onerror="window.GUNJIN_STRENGTH_MISSING = true"></script>
<script src="../common/online.js"></script>
<script src="js/app.js"></script>
</body>
</html>
