<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チューリング・テーブル</title>
<meta name="description" content="AI が作った AI に、人類は勝てるか。AI が一から作り、自己対局だけで強くした AI と対戦できるゲーム集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* チューリング・テーブルの入り口: ゲームを選ぶ。全体のオンライン人数と、ゲームごとの対戦待ち・対局中をその場で表示。1画面に収める */
:root {
  --bg: #f3f1ec; --bg2: #e9e5dc; --surface: #fbfaf7; --ink: #15140f; --muted: #6b665a; --line: #d9d3c6;
  --gold: #a07a24; --gold-2: #c9a24a; --good: #23845a; --glow: rgba(160, 122, 36, .18);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0b; --bg2: #16150f; --surface: #191813; --ink: #ece7da; --muted: #9a9384; --line: #2c2a22;
    --gold: #d2ab55; --gold-2: #f0cf7e; --good: #5cc790; --glow: rgba(210, 171, 85, .16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0b; --bg2: #16150f; --surface: #191813; --ink: #ece7da; --muted: #9a9384; --line: #2c2a22;
  --gold: #d2ab55; --gold-2: #f0cf7e; --good: #5cc790; --glow: rgba(210, 171, 85, .16); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--glow), transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 59px, color-mix(in srgb, var(--line) 45%, transparent) 59px 60px),
    repeating-linear-gradient(0deg, transparent 0 59px, color-mix(in srgb, var(--line) 45%, transparent) 59px 60px),
    var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; padding: clamp(14px, 4vh, 44px) 0 12px; gap: clamp(10px, 2.4vh, 22px); }
header { display: grid; gap: 4px; }
.kicker { font-size: 11px; letter-spacing: .32em; color: var(--gold); font-weight: 700; text-transform: uppercase; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6.4vw, 56px); line-height: 1.08; letter-spacing: .04em; }
h1 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: clamp(11px, 1.6vw, 14px); letter-spacing: .3em; color: var(--muted); margin-top: 6px; }
.lead { margin: 4px 0 0; font-family: var(--font-display); font-size: clamp(15px, 2.6vw, 22px); font-weight: 600; }
.lead em { font-style: normal; color: var(--gold); }
.live { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.live b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; margin-right: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .5; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.live[data-st="on"] .dot { background: var(--good); opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); grid-auto-rows: 1fr; gap: 12px; align-content: stretch; }
.tile {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 4px; padding: 14px 16px; border-radius: 16px; min-height: 0; overflow: hidden;
  background: linear-gradient(160deg, color-mix(in srgb, var(--surface) 92%, var(--accent) 8%), var(--surface));
  border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform .2s cubic-bezier(.2,.8,.2,1), border-color .16s, box-shadow .16s;
  transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px));
}
a.tile:hover, a.tile:focus-visible { --ty: -3px; border-color: var(--accent); box-shadow: 0 14px 30px -14px var(--accent); outline: none; }
/* 指した所に光（マウスのとき） */
a.tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%); }
a.tile:hover::before { opacity: 1; }
/* 本日のピックアップ（XP×1.5）と、最強に勝ったゲームの王冠。.ttj-move は common/juice.js が付ける（動きオンのとき） */
.tile.pick { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px -6px var(--gold-2); }
.ttj-move .tile.pick { animation: pick 2.4s ease-in-out infinite; }
@keyframes pick { 50% { box-shadow: 0 0 0 1px var(--gold), 0 0 32px -2px var(--gold-2); } }
.chip.hot { border-color: var(--gold); color: var(--ink); background: linear-gradient(90deg, color-mix(in srgb, #ffd45a 45%, transparent), color-mix(in srgb, #ff9a3c 35%, transparent)); font-weight: 700; }
.chip.won { color: var(--ink); }
.tile .cr { position: absolute; top: 10px; right: 12px; width: 20px; height: 20px; color: var(--gold-2); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--gold-2) 70%, transparent)); }
.tile .cr svg { width: 100%; height: 100%; display: block; }
.tile .cr.u { color: #ff6584; }
.ttj-move .tile .cr.u { animation: hue 3s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg) drop-shadow(0 0 6px #ff6584); } }
.ttj-move .grid.intro .tile { animation: tin .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 38ms); }
@keyframes tin { from { opacity: 0; transform: translateY(16px) scale(.95); } }
/* ゆっくり動く光（背景） */
body::before { content: ""; position: fixed; inset: -20%; pointer-events: none; z-index: -1;
  background: radial-gradient(38% 30% at 22% 28%, var(--glow), transparent 70%), radial-gradient(34% 28% at 78% 72%, color-mix(in srgb, var(--gold-2) 12%, transparent), transparent 70%); }
.ttj-move body::before { animation: drift 20s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(5%, -4%) rotate(10deg); } }
/* あなたのレベル・連勝・実績・毎日のボーナス（common/juice.js の記録。この端末だけ） */
.me { display: flex; align-items: center; gap: 8px; }
.prof { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; cursor: pointer; text-align: left; }
.prof:hover, .prof:focus-visible { border-color: var(--gold); outline: none; }
.prof .ttj-badge { width: 38px; height: 42px; font-size: 15px; }
.pm { flex: 1; min-width: 0; display: grid; gap: 5px; }
.pt { display: flex; align-items: baseline; gap: 10px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.pt .ttj-rk { font-weight: 800; letter-spacing: .1em; font-size: 12px; color: color-mix(in srgb, var(--rk) 70%, var(--ink)); }
.pt .xp { margin-left: auto; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 12px var(--font-body); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill:hover, .pill:focus-visible { border-color: var(--gold); outline: none; }
.pill[hidden] { display: none; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.fire { cursor: default; color: #e2541b; border-color: color-mix(in srgb, #ff7a2e 50%, var(--line)); }
.pill.gift { color: var(--muted); }
.pill.gift.ready { color: #2b1700; border-color: #ffcf5a; background: linear-gradient(135deg, #ffe07a, #ff9a3c); box-shadow: 0 0 18px -4px #ffb02e; }
.ttj-move .pill.gift.ready svg { animation: wob 1.8s ease-in-out infinite; transform-origin: 50% 80%; }
@keyframes wob { 0%, 55%, 100% { rotate: 0deg; } 62% { rotate: -14deg; } 70% { rotate: 12deg; } 78% { rotate: -6deg; } 86% { rotate: 3deg; } }
.tile .em { position: absolute; right: -6px; bottom: -18px; font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 11vh, 110px); line-height: 1; color: var(--accent); opacity: .16; pointer-events: none; }
.tile .nm { font-family: var(--font-display); font-weight: 800; font-size: clamp(17px, 2.4vh, 22px); line-height: 1.2; }
.tile .nm .n-s { display: none; }
.tile .nm small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-top: 2px; }
.tile .tg { font-size: 12px; color: var(--muted); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.tile .ft { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; }
.chip { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.wait { border-color: color-mix(in srgb, var(--good) 60%, transparent); color: var(--good); font-weight: 700; }
.chip.soon { border-style: dashed; }
.tile.soon { opacity: .62; }
.tile.soon .pl { display: none; }
.tile.soon .nm::after { content: "近日公開"; display: inline-block; margin-left: 8px; vertical-align: 3px; font: 700 10px var(--font-body); letter-spacing: .1em; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 7px; }
header { position: relative; }
/* 全ゲームの音の元栓（common/mute.js） */
.snd { position: absolute; top: -4px; right: 0; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 12px var(--font-body); cursor: pointer; }
.snd:hover, .snd:focus-visible { border-color: var(--gold); outline: none; }
.snd svg { width: 16px; height: 16px; flex: none; }
.snd .off, .snd[aria-pressed="true"] .on { display: none; }
.snd[aria-pressed="true"] .off { display: inline; }
.snd[aria-pressed="true"] { color: var(--muted); }
footer { font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
footer a { color: inherit; }
/* スマホ縦: 3列のタイル、説明は省いて名前と人数だけ */
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { padding: 10px; border-radius: 12px; grid-template-rows: auto 1fr auto; }
  .tile .tg { display: none; }
  .tile .nm { font-size: 14px; }
  .tile .nm small, .tile .nm .n-l { display: none; }
  .tile .nm .n-s { display: inline; }
  h1 { font-size: min(28px, calc((100vw - 32px) / 12)); letter-spacing: .02em; white-space: nowrap; }
  .live { gap: 10px; font-size: 12px; }
  .live b { font-size: 16px; }
  .tile.soon .nm::after { display: block; margin: 4px 0 0; width: max-content; }
  .tile .ft .pl { display: none; }
  .tile .em { font-size: 64px; bottom: -12px; }
  .lead { font-size: 15px; }
  .snd { padding: 5px 7px; }
  .snd .t { display: none; }
}
@media (max-width: 360px) {
  .tile { padding: 8px; }
  .tile .nm { font-size: 13px; }
  .live { gap: 8px; font-size: 11px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .tile { padding: 8px 10px; border-radius: 12px; }
  .tile .em { font-size: 48px; bottom: -10px; }
  .tile.soon .nm::after { display: block; margin: 4px 0 0; width: max-content; }
  .tile .tg, .tile .nm small, .tile .nm .n-l { display: none; }
  .tile .nm .n-s { display: inline; }
  .tile .nm { font-size: 15px; }
  h1 small, .kicker { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
@media (max-width: 560px) {
  .me { gap: 6px; }
  .prof { padding: 4px 10px 4px 4px; gap: 8px; }
  .prof .ttj-badge { width: 32px; height: 35px; font-size: 13px; }
  .pt .ttj-nx { display: none; }
  .pill { padding: 7px 9px; }
  .pill .t { display: none; }
  .tile .cr { top: 6px; right: 6px; width: 16px; height: 16px; }
}
@media (max-height: 520px) and (orientation: landscape) { .pt .ttj-nx { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">Software singularity is here</span>
    <button class="snd" id="snd" type="button" aria-pressed="false" aria-label="すべてのゲームの音を消す" title="すべてのゲームの音を消す／戻す"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6M22 9l-6 6"/></svg><span class="t">音 オン</span></button>
    <h1>チューリング・テーブル<small>TURING TABLE</small></h1>
    <p class="lead">AI が作った AI に、<em>人類は勝てるか。</em></p>
  </header>
  <div class="me" id="me">
    <button class="prof" id="prof" type="button" aria-label="実績と記録を見る"><span class="ttj-badge"></span><span class="pm"><span class="pt"><span class="ttj-rk"></span><span class="ttj-nx"></span><span class="xp" id="xp"></span></span><span class="ttj-bar"><i></i></span></span></button>
    <span class="pill fire" id="streak" hidden title="連勝中（勝つたびに XP が増えます）"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.3C11 8 12 5 12 2z"/></svg><b id="n-streak"></b><span class="t">連勝</span></span>
    <button class="pill" id="ach" type="button" title="実績と記録"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v2h3v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V5h3zm0 4H6v1a3 3 0 0 0 1.2 2.4A7 7 0 0 1 7 9zm10 0v2a7 7 0 0 1-.2 1.4A3 3 0 0 0 18 8V7z"/></svg><span id="n-ach"></span></button>
    <button class="pill gift" id="gift" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7c-1.5-3-5-4-5-1.5S10 7 12 7zm0 0c1.5-3 5-4 5-1.5S14 7 12 7z"/></svg><span class="t" id="gift-t"></span></button>
  </div>
  <div class="live" id="live" data-st="off"><span><span class="dot"></span><b id="n-on">—</b>人がオンライン</span><span><b id="n-wait">—</b>人が対戦待ち</span><span><b id="n-play">—</b>人が対局中</span></div>
  <main class="grid" id="grid" aria-label="ゲーム"></main>
  <footer>
    <span>人間が作ったエンジンや棋譜は使わず、AI（Claude）がルール・画面・学習を作り、自己対局だけで強くした AI です。</span>
    <span>オンライン対戦は公開の中継サーバー経由（名前と指し手はほかの人からも見える可能性があります）</span>
  </footer>
</div>
<script src="common/mute.js"></script>
<script src="common/juice.js"></script>
<script src="common/online.js"></script>
<script>
(function () {
  'use strict';
  // 並び順・紋章の文字・色は common/juice.js の一覧（実績と共通）。名前と説明と状態は各ゲームの manifest.json から読む。status が ready のものだけ遊べる（無ければ「近日公開」）
  const J = window.TTJuice;
  const GAMES = J.GAMES.map(g => Object.assign({}, g));
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const playersText = p => (p === '2' ? '2人' : p ? `${String(p).replace('-', '〜')}人` : '');
  let counts = null, loaded = false, intro = true;
  const CROWN = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
  const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const ICON_GIFT = $('gift').querySelector('svg').outerHTML;

  function render() {
    if (!loaded) return;
    const st = J.state();
    $('grid').innerHTML = GAMES.map((g, i) => {
      const ready = g.status === 'ready';
      const c = counts && counts.byGame[g.slug];
      const live = c && (c.wait || c.play) ? `${c.wait ? `<span class="chip wait">待ち${c.wait}</span>` : ''}${c.play ? `<span class="chip">対局中${c.play}</span>` : ''}` : '';
      const me = st.games[g.slug] || {}, pick = ready && st.pickup === g.slug;
      const mine = `${pick ? '<span class="chip hot">本日 XP×1.5</span>' : ''}${me.w ? `<span class="chip won">${me.w}勝</span>` : ''}`;
      const crown = me.top >= 4 ? `<span class="cr${me.top >= 5 ? ' u' : ''}" title="${me.top >= 5 ? '超最強' : '最強'}に勝った">${CROWN}</span>` : '';
      const inner = `${crown}
        <span class="em" aria-hidden="true">${esc(g.em)}</span>
        <span class="nm"><span class="n-l">${esc(g.name)}</span><span class="n-s">${esc(g.short || g.name)}</span><small>${esc(g.en || '')}</small></span>
        <span class="tg">${esc(g.tagline || '')}</span>
        <span class="ft">${mine}${g.players ? `<span class="chip pl">${playersText(g.players)}</span>` : ''}${live}</span>`;
      return ready
        ? `<a class="tile ttj-btn${pick ? ' pick' : ''}" href="${g.slug}/" style="--accent:${g.accent};--i:${i}" aria-label="${esc(g.name)}で遊ぶ${pick ? '（本日のピックアップ）' : ''}">${inner}</a>`
        : `<div class="tile soon" style="--accent:${g.accent};--i:${i}" aria-label="${esc(g.name)}（近日公開）">${inner}</div>`;
    }).join('');
    if (intro) { intro = false; $('grid').classList.add('intro'); setTimeout(() => $('grid').classList.remove('intro'), 1400); }
  }

  // あなたのレベル・連勝・実績・毎日のボーナス
  function renderMe() {
    const st = J.state();
    J.paint($('prof'), st.level, st.cur / st.need, st.need - st.cur);
    $('xp').textContent = `${st.xp.toLocaleString()} XP`;
    $('streak').hidden = st.streak < 2;
    $('n-streak').textContent = st.streak;
    $('n-ach').textContent = `${st.achDone}/${st.achTotal}`;
    const h = Math.max(1, Math.ceil((new Date().setHours(24, 0, 0, 0) - Date.now()) / 3600000));
    $('gift').classList.toggle('ready', st.daily);
    $('gift-t').textContent = st.daily ? 'デイリーボーナス' : `あと${h}時間`;
    $('gift').title = st.daily ? '今日のボーナスを受け取る' : `次のボーナスまで あと${h}時間`;
  }
  $('prof').addEventListener('click', () => J.openAchievements());
  $('ach').addEventListener('click', () => J.openAchievements());
  $('gift').addEventListener('click', () => {
    if (J.state().daily) J.daily();
    else J.toast(`<span class="ttj-ic">${ICON_CLOCK}</span><span><span class="ttj-k">デイリーボーナス</span><span class="ttj-n">今日はもう受け取りました。また明日！</span></span><span></span>`);
  });
  J.on(() => { renderMe(); render(); });
  renderMe();
  setInterval(renderMe, 60000);
  if (J.state().daily) setTimeout(() => J.toast(`<span class="ttj-ic">${ICON_GIFT}</span><span><span class="ttj-k">デイリーボーナス</span><span class="ttj-n">今日のボーナスを受け取れます</span></span><span class="ttj-x">最大1,000 XP</span>`, { ms: 4200 }), 900);

  // 傾くタイル（マウスのとき。指した所に光）
  $('grid').addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !J.motion) return;
    const t = e.target.closest && e.target.closest('a.tile');
    if (!t) return;
    const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    t.style.setProperty('--rx', ((0.5 - y) * 9).toFixed(2) + 'deg');
    t.style.setProperty('--ry', ((x - 0.5) * 11).toFixed(2) + 'deg');
    t.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    t.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  });
  $('grid').addEventListener('pointerout', e => {
    const t = e.target.closest && e.target.closest('a.tile');
    if (t && !t.contains(e.relatedTarget)) { t.style.removeProperty('--rx'); t.style.removeProperty('--ry'); }
  });

  // 音の元栓（全ゲーム共通。common/mute.js が localStorage に覚え、ゲームのページで効く）
  function showSnd() {
    const m = !!(window.TTSound && TTSound.muted);
    $('snd').setAttribute('aria-pressed', String(m));
    $('snd').querySelector('.t').textContent = m ? '音 オフ' : '音 オン';
  }
  $('snd').addEventListener('click', () => { if (window.TTSound) { TTSound.set(!TTSound.muted); showSnd(); } });
  window.addEventListener('storage', e => { if (e.key === 'tt-mute') showSnd(); });
  showSnd();

  // 各ゲームの manifest.json（公開されているものだけある）
  Promise.all(GAMES.map(g => fetch(`${g.slug}/manifest.json`, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null)))
    .then(ms => { ms.forEach((m, i) => { if (m) Object.assign(GAMES[i], { name: m.name || GAMES[i].name, tagline: m.tagline, players: m.players, status: m.status, en: m.en || GAMES[i].en }); }); loaded = true; render(); });

  // 全体のオンライン人数（このページを見ている人も「オンライン」に数える）
  if (window.SSIHOnline && SSIHOnline.available()) {
    let name = '';
    try { name = JSON.parse(localStorage.getItem('gungi-name')) || ''; } catch (e) { /* 名前なし */ }
    const net = SSIHOnline.create({
      game: 'hub',
      onStatus: st => { $('live').dataset.st = st; update(); },
      onPresence: () => update(),
    });
    function update() {
      if (net.status !== 'on') return;
      counts = net.counts();
      $('n-on').textContent = counts.online; $('n-wait').textContent = counts.wait; $('n-play').textContent = counts.play;
      render();
    }
    net.setName(name);
    net.connect();
  }
})();
</script>
</body>
</html>
