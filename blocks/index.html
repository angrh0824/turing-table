<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブロック陣取り — チューリング・テーブル</title>
<meta name="description" content="形の違うピースを角でつないで陣地を広げる、2〜4人の陣取り。自己対局だけで強くなった自作の AI と対局できます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 盤が主役。縦長の画面は 対局者 → 盤 → 情報の行 → 手持ち → 操作 の順に積む。横長・PC は 盤の右に並べる */
:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --surface-2: #f1f3f8;
  --surface-3: #e3e7ef;
  --ink: #18202e;
  --muted: #5b6577;
  --line: #d3d9e3;
  --accent: #3653c9;
  --accent-soft: rgba(54, 83, 201, .13);
  --accent-ink: #ffffff;
  --gold: #a87710;
  --good: #23824d;
  --bad: #b73a2c;
  --board: #dde3ec;
  --board-hi: #eef2f7;
  --board-lo: #cfd7e3;
  --grid: rgba(70, 88, 120, .22);
  --frame: #c3ccd9;
  --shadow: 0 1px 2px rgba(20, 30, 50, .16), 0 10px 28px rgba(20, 30, 50, .12);
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --radius: 12px;
  --c0: #2b6be0; --c1: #f0b429; --c2: #e0473b; --c3: #26a259;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #171b23; --surface-2: #1f242e; --surface-3: #283040; --ink: #e5e9f1; --muted: #98a2b6; --line: #2b3240;
    --accent: #8ca3ff; --accent-soft: rgba(140, 163, 255, .16); --accent-ink: #0d1324; --gold: #dbaa45; --good: #5fc08a; --bad: #ec7b68;
    --board: #1b2029; --board-hi: #232a35; --board-lo: #151920; --grid: rgba(160, 175, 205, .14); --frame: #2d3442;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #171b23; --surface-2: #1f242e; --surface-3: #283040; --ink: #e5e9f1; --muted: #98a2b6; --line: #2b3240;
  --accent: #8ca3ff; --accent-soft: rgba(140, 163, 255, .16); --accent-ink: #0d1324; --gold: #dbaa45; --good: #5fc08a; --bad: #ec7b68;
  --board: #1b2029; --board-hi: #232a35; --board-lo: #151920; --grid: rgba(160, 175, 205, .14); --frame: #2d3442;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- ヘッダー ---------- */
.top { display: flex; align-items: center; gap: 10px 14px; width: 100%; max-width: 1320px; margin: 0 auto; padding-block: 12px 10px; flex: none; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: .06em; margin: 0; line-height: 1; white-space: nowrap; }
.brand h1 .dots { display: inline-flex; gap: 3px; vertical-align: 3px; margin-right: 8px; }
.brand h1 .dots i { width: 9px; height: 9px; border-radius: 2.5px; display: block; }
.brand > span { color: var(--muted); font-size: 11px; letter-spacing: .16em; white-space: nowrap; }
.brand .home { align-self: center; color: var(--muted); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 2px 3px; border-radius: 6px; }
.brand .home:hover, .brand .home:focus-visible { color: var(--ink); }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: none; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { width: 100%; max-width: 1320px; margin: 0 auto; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#view-rules, #view-ai { overflow-y: auto; height: 100%; overscroll-behavior: contain; padding-bottom: 14px; }

/* ---------- 対局画面（縦長: 1列。横長: 盤の右にパネル） ---------- */
.play { height: 100%; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
  grid-template-areas: "players" "board" "info" "tray" "controls" "side"; justify-items: center; align-content: start; padding-bottom: 8px; }
.play > * { width: 100%; max-width: var(--bw, 640px); min-width: 0; }
.players { grid-area: players; }
.board-wrap { grid-area: board; }
.info { grid-area: info; }
.navrow { grid-area: nav; }
.tray { grid-area: tray; }
.controls { grid-area: controls; }
.side { grid-area: side; }
.play .navrow { display: none; }
@media (orientation: landscape) and (min-width: 700px) {
  .play { grid-template-columns: auto minmax(300px, 460px); grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
    grid-template-areas: "board players" "board info" "board nav" "board tray" "board controls" "board side"; column-gap: 18px; justify-content: center; justify-items: stretch; }
  .play > * { max-width: none; }
  .board-wrap { width: var(--bw, 600px); align-self: start; }
  .play .navrow { display: flex; }
}

/* 対局者（色ごと）: 色の宝石・名前・いまの得点・残りのピース。手番は輪。AI補助で見込み */
.players { display: grid; grid-template-columns: repeat(var(--np, 4), minmax(0, 1fr)); gap: 6px; }
.pl { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 0 7px; padding: 5px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; transition: border-color .2s, box-shadow .2s, opacity .2s; }
.pl.turn { border-color: var(--pc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--pc) 35%, transparent); }
.pl.out { opacity: .62; }
.pl .gem { width: 18px; height: 18px; border-radius: 5px; grid-row: span 2; background: linear-gradient(145deg, color-mix(in srgb, var(--pc) 55%, #fff), var(--pc) 55%, color-mix(in srgb, var(--pc) 70%, #000)); box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 1px 2px rgba(0,0,0,.25); }
.pl .nm { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.pl .st { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; font-variant-numeric: tabular-nums; }
.pl .st b { color: var(--ink); font-weight: 700; }
.pl .ev { grid-column: 1 / -1; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 1px; }
.pl .ev b { color: var(--ink); }
.pl .ev .bar { display: inline-block; vertical-align: middle; width: 34px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-right: 4px; }
.pl .ev .bar i { display: block; height: 100%; background: var(--pc); }
.pl .think { position: absolute; top: 4px; right: 5px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--pc); border-right-color: transparent; animation: spin .8s linear infinite; }
.pl .tag { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }
@media (max-width: 430px) { .pl .tag { font-size: 9px; padding: 0 4px; margin-left: 3px; } }
.pl .tag.on { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold); }
.pl .tag.off { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
@keyframes spin { to { transform: rotate(360deg); } }
.eval-off .pl .ev { display: none; }
@media (orientation: landscape) and (min-width: 700px) {
  .players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .players[data-np="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* 盤 */
.board-wrap { position: relative; aspect-ratio: 1 / 1; touch-action: none; user-select: none; -webkit-user-select: none; }
#board { display: block; width: 100%; height: 100%; border-radius: 12px; box-shadow: var(--shadow); cursor: crosshair; }
#board .cellbg { fill: url(#g-board); }
#board .gridl { stroke: var(--grid); stroke-width: .035; fill: none; }
#board .frame { fill: none; stroke: var(--frame); stroke-width: .12; }
#board .start { fill: none; stroke-width: .1; stroke-dasharray: .2 .14; opacity: .85; }
#board .startdot { opacity: .55; }
#board .anc { pointer-events: none; }
#board .anc circle { opacity: .5; }
#board .anc.use circle { opacity: 1; animation: glow 1.4s ease-in-out infinite alternate; }
@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
#board .last { fill: none; stroke: #fff; stroke-width: .09; opacity: .9; pointer-events: none; }
:root[data-theme="dark"] #board .last { stroke: #fff; }
#board .best { fill-opacity: .18; stroke-width: .1; stroke-dasharray: .26 .14; pointer-events: none; animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -.8; } }
#board .ghost { pointer-events: none; transition: transform .08s ease-out; }
#board .ghost.bad .gcell { opacity: .42; }
#board .ghost .gline { fill: none; stroke-width: .11; }
#board .dimmed { opacity: .5; }
.board-msg { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; box-shadow: var(--shadow); pointer-events: none; white-space: nowrap; transition: opacity .25s; }

/* 情報の行（高さ固定）: 状況・選んだピース・直前の手 ＋ 道具 */
.info { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 5px 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; white-space: nowrap; overflow: hidden; }
.info .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.info .txt .muted { color: var(--muted); font-size: 12px; }
.info .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.info .tools { margin-left: auto; display: flex; gap: 3px; flex: none; align-items: center; }
.info.alert { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.info.result { background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.info.view { background: var(--surface-2); }
.info.sel { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.ibtn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; color: var(--ink); flex: none; }
.ibtn:hover:not([disabled]) { background: var(--surface-2); }
.ibtn[disabled] { opacity: .3; cursor: default; }
.ibtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ibtn.ok { background: var(--accent); color: var(--accent-ink); width: auto; padding: 0 12px; gap: 4px; display: inline-flex; align-items: center; font-weight: 700; }
.ibtn.ok[disabled] { background: var(--surface-3); color: var(--muted); opacity: 1; }
.navrow { display: flex; align-items: center; gap: 2px; padding: 3px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tape { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.tape::-webkit-scrollbar { display: none; }
.tape button { flex: none; border: 0; background: transparent; border-radius: 7px; padding: 4px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.tape button:hover { background: var(--surface-2); }
.tape button .no { color: var(--muted); font-size: 10px; }
.tape button i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tape button.cur { background: var(--accent); color: var(--accent-ink); }
.tape button.cur .no { color: inherit; opacity: .8; }
.tape button.pass { color: var(--muted); font-size: 11px; }

/* 手持ちのピース（色ごと21個）。押すと選ぶ。置けないピースはやんわり暗く */
.tray { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.tray .slot { position: relative; border: 0; background: var(--surface-2); border-radius: 8px; padding: 0; cursor: pointer; height: var(--slot-h, 40px); display: grid; place-items: center; min-width: 0; transition: transform .12s, background .12s, opacity .15s; }
.tray .slot svg { overflow: visible; max-width: 96%; max-height: 90%; }
.tray .slot.used { visibility: hidden; }
.tray .slot.cant { opacity: .38; }
.tray .slot.sel { background: color-mix(in srgb, var(--pc) 22%, var(--surface)); box-shadow: 0 0 0 2px var(--pc); transform: translateY(-2px); }
.tray .slot:not([disabled]):hover { background: var(--surface-3); }
.tray .slot.sel:hover { background: color-mix(in srgb, var(--pc) 26%, var(--surface)); }
.tray .slot[disabled] { cursor: default; }
.tray .slot .sz { position: absolute; right: 3px; bottom: 1px; font-size: 9px; color: var(--muted); font-weight: 700; }
.tray-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin: -1px 2px 1px; white-space: nowrap; overflow: hidden; }
.tray-head b { color: var(--ink); }
.tray-head .grow { margin-left: auto; }
.tray.watch .slot { cursor: default; }

.controls { display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.aibtn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.aibtn[aria-pressed="true"] { border-color: var(--good); }
.aibtn[aria-pressed="true"] .led { background: var(--good); opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.more-wrap { position: relative; margin-left: auto; }
.menu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 210px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.menu button:hover:not([disabled]) { background: var(--surface-2); }
.menu button[disabled] { opacity: .4; cursor: default; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; border: 1px solid var(--line); margin: 0; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* 振り返り・形勢（広い画面ではパネルの下、狭い画面では下からせり上がる） */
.side { min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.sheet-head { display: flex; align-items: center; gap: 8px; position: relative; }
.sheet-head [data-act="sheet-close"] { display: none; }
.sheet-tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 999px; flex: 1; }
.sheet-tabs button { flex: 1; border: 0; background: transparent; padding: 4px 8px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 12.5px; }
.sheet-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.side .card { display: none; }
.side[data-tab="ev"] .evcard, .side[data-tab="graph"] .graph { display: block; }
.side[data-tab="kifu"] .kifucard { display: flex; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.card h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { margin-left: auto; letter-spacing: 0; font-weight: 500; }
.side .evcard { flex: 0 1 auto; overflow-y: auto; min-height: 0; }
.side .graph { flex: 1 1 auto; min-height: 0; }
.side .graph svg { height: calc(100% - 22px); min-height: 70px; }
.side .kifucard { flex: 1 1 auto; min-height: 60px; flex-direction: column; overflow: hidden; }
.kifu { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: 12.5px; font-variant-numeric: tabular-nums; min-height: 0; }
.kifu li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 6px; padding: 2px 8px; border-radius: 7px; cursor: pointer; align-items: center; }
.kifu li:hover { background: var(--surface-2); }
.kifu li.cur { background: var(--accent-soft); }
.kifu li .no { color: var(--muted); text-align: right; }
.kifu li i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.kifu li.pass { color: var(--muted); font-size: 11.5px; }
.kifu .ev { color: var(--muted); font-size: 11px; }
.graph svg { width: 100%; height: 110px; display: block; cursor: pointer; }
.graph .axis { stroke: var(--line); }
.graph text { fill: var(--muted); font-size: 9px; }
.graph .now { stroke: var(--accent); stroke-width: 1.2; }
.pvline { font-size: 12.5px; margin-top: 6px; line-height: 1.6; }
.pvline .k { color: var(--muted); font-size: 11px; letter-spacing: .08em; margin-right: 6px; }
.meta { color: var(--muted); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.evtable { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.evtable td { padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.evtable td:first-child { width: 1%; }
.evtable .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.row-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.eval-off .evcard, .eval-off .graph, .eval-off .sheet-tabs [data-st="ev"], .eval-off .sheet-tabs [data-st="graph"] { display: none !important; }
@media (orientation: portrait), (max-width: 699px), (max-height: 500px) {
  .side { position: fixed; left: 0; right: 0; bottom: 0; top: var(--sheet-top, 45%); z-index: 60; gap: 8px; max-width: none !important; width: auto !important;
    background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 28px rgba(0,0,0,.2);
    padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s; }
  .side.open { transform: none; visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .sheet-head [data-act="sheet-close"] { display: grid; }
  .sheet-head::before { content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); }
  .sheet-tabs { margin-top: 8px; }
  .sheet-tabs button { padding: 6px 8px; font-size: 14px; }
  .side .card { border: 0; padding: 0; background: transparent; }
  .side .navrow-s { display: flex !important; }
  .eval-off .sheet-tabs [data-st="ev"], .eval-off .sheet-tabs [data-st="graph"] { display: none; }
}
.navrow-s { display: none; align-items: center; gap: 2px; }

/* ---------- ダイアログ ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 16, .5); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; }
.dialog h2 { margin: 0 0 14px; font-family: var(--font-display); font-size: 23px; font-weight: 900; }
.field { display: grid; gap: 7px; margin-bottom: 15px; }
.field > .lab { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); padding: 7px 13px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 8px; }
.cards button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 11px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.cards button b { font-size: 15px; }
.cards button small { color: var(--muted); font-size: 11px; line-height: 1.5; }
.cards button .stars { color: var(--gold); letter-spacing: 2px; font-size: 12px; }
.cards button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.hint { font-size: 12px; color: var(--muted); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.dialog textarea { width: 100%; min-height: 150px; font: 13px/1.6 var(--font-body); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.result-title { font-family: var(--font-display); font-size: 32px; font-weight: 900; margin: 0; }
.rank { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-variant-numeric: tabular-nums; }
.rank td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
.rank td.r { font-family: var(--font-display); font-weight: 900; font-size: 18px; width: 2.4em; }
.rank td.s { text-align: right; font-weight: 700; font-size: 16px; }
.rank .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.rank tr.me td { background: var(--accent-soft); }
@media (max-width: 560px) {
  .overlay { padding: 10px; align-items: end; }
  .dialog { padding: 15px 15px calc(13px + env(safe-area-inset-bottom, 0px)); }
  .dialog h2 { font-size: 20px; margin-bottom: 10px; }
  .field { margin-bottom: 11px; gap: 5px; }
  .seg { gap: 4px; }
  .seg button { padding: 6px 9px; font-size: 13px; }
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .cards button { padding: 7px 4px; text-align: center; border-radius: 10px; }
  .cards button b { font-size: 13px; }
  .cards button small { display: none; }
  .cards button .stars { letter-spacing: 0; font-size: 10px; }
  .on-stats { gap: 14px; margin-bottom: 6px; }
  .on-stats .stat b { font-size: 24px; }
  .on-stats .stat span { font-size: 11px; }
  .on-msg { margin-bottom: 8px; padding: 6px 10px; }
  .on-list { max-height: 24vh; }
  #dlg-online .field { margin-bottom: 9px; }
  #dlg-online .on-note { font-size: 10.5px; margin: 0; }
}
/* オンライン */
.onbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; flex: none; }
.onbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; flex: none; }
.onbtn[data-st="on"] .dot { background: #2fb36a; opacity: 1; box-shadow: 0 0 0 3px rgba(47, 179, 106, .25); }
.onbtn[data-st="connecting"] .dot { background: var(--gold); opacity: 1; }
.onbtn small { font-weight: 500; color: var(--muted); }
.on-stats { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
.on-stats .stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.on-stats .stat span { color: var(--muted); font-size: 12px; }
.on-conn { margin-left: auto; font-size: 12px; color: var(--muted); }
.on-conn[data-st="on"] { color: var(--good); }
.on-msg { margin: 0 0 10px; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); font-size: 13px; }
.on-list { display: grid; gap: 6px; max-height: 200px; overflow-y: auto; }
.on-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.on-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.seats > div { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; background: var(--surface-2); display: grid; gap: 2px; min-width: 0; }
.seats > div.me { border-color: var(--accent); background: var(--accent-soft); }
.seats b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; font-size: 16px; }
input.text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.aitag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.aitag.off { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.aitag.on { background: color-mix(in srgb, var(--gold) 24%, transparent); color: var(--gold); }
.popover { position: absolute; right: 0; top: 44px; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 10px; min-width: 240px; }
.settings-wrap { position: relative; flex: none; }

/* ---------- ルール / AI（タブで1枚ずつ） ---------- */
.doc { max-width: 960px; margin: 0 auto; display: grid; gap: 12px; align-content: start; }
.doctabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; overflow-x: auto; scrollbar-width: none; box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
.doctabs::-webkit-scrollbar { display: none; }
.doctabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.doctabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.doc .card { padding: 14px 16px; }
.doc .card p, .doc .card li { max-width: 72ch; }
.doc h3 { font-family: var(--font-display); font-size: 20px; font-weight: 900; margin: 0 0 8px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 10px 0; }
.figs figure { margin: 0; display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 12px; color: var(--muted); }
.figs figure svg { width: 100%; max-width: 170px; height: auto; border-radius: 8px; }
.figs figure b { color: var(--ink); }
.figs figure.ok b { color: var(--good); }
.figs figure.ng b { color: var(--bad); }
.pcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.pcs div { background: var(--surface-2); border-radius: 8px; padding: 6px 4px 4px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.pcs svg { width: 52px; height: 44px; }
table.lv { border-collapse: collapse; width: 100%; font-size: 13px; }
table.lv th, table.lv td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
.tbl { overflow-x: auto; }
.stat-row { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.doc a { color: var(--accent); }
@media (max-width: 560px) {
  .doc { gap: 9px; }
  .doc .card { padding: 11px 13px; }
  .doc h3 { font-size: 17px; margin-bottom: 4px; }
  .doc .card ul { padding-left: 18px; margin: 4px 0; }
  .doc .card li, .doc .card p { font-size: 12.5px; line-height: 1.55; }
  .doc .card p { margin: 5px 0; }
  .figs { gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 6px 0; }
  .figs figure { font-size: 10.5px; }
  .pcs { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .pcs svg { width: 100%; height: 30px; }
  .pcs div { font-size: 9.5px; padding: 4px 2px 2px; }
}
@media (max-width: 560px) {
  .top { gap: 7px; padding-block: 8px 8px; }
  .brand h1 { font-size: 19px; letter-spacing: .02em; }
  .brand h1 .dots { display: none; }
  .brand > span { display: none; }
  .tabs button { padding: 5px 9px; font-size: 13px; }
  .iconbtn { width: 34px; height: 34px; }
  .onbtn { height: 34px; padding: 0 9px; gap: 5px; font-size: 12px; }
  .play { gap: 6px; }
  .players { gap: 4px; }
  .pl { padding: 4px 6px; gap: 0 5px; border-radius: 9px; }
  .pl .gem { width: 14px; height: 14px; border-radius: 4px; }
  .pl .nm { font-size: 11.5px; }
  .pl .st { font-size: 10.5px; }
  .pl .ev { font-size: 10px; }
  .pl .ev .bar { width: 20px; }
  .info { height: 42px; font-size: 12.5px; padding-left: 10px; }
  .ibtn { width: 34px; height: 34px; }
  .controls { gap: 5px; }
  .controls .btn { padding: 6px 9px; font-size: 13px; }
  .tray { padding: 4px; gap: 3px; }
}
@media (max-width: 430px) {
  .top { gap: 5px; }
  .brand { gap: 4px; }
  /* 狭い画面: 名前を2行に（「対戦」の入口と並んでも欠けないように） */
  .brand h1 { font-size: 13.5px; letter-spacing: 0; line-height: 1.1; }
  .brand h1 .h1b { display: block; }
  .brand .home { font-size: 22px; padding: 0 1px 2px; }
  .tabs { padding: 2px; }
  .tabs button { padding: 4px 7px; font-size: 12px; }
  .onbtn { padding: 0 8px; }
  .onbtn small { display: none; }
  .pl .st .left { display: none; }
  .pl .ev .w { display: none; }
  .tray-head .grow, .tray-head .cnt { display: none; }
  .pl .nm .lvl { display: none; }
}
.pl .st .lefts { display: none; }
@media (max-width: 430px) { .pl .st .lefts { display: inline; font-size: 10px; } }
.lvs { display: none; } .pl .nm .lvs { color: var(--gold); font-size: 9.5px; letter-spacing: -1px; margin-left: 2px; }
@media (max-width: 430px) { .pl .nm .lvs { display: inline; } }
/* 横長のスマホ（高さが足りない）: ヘッダーを詰める */
@media (orientation: landscape) and (max-height: 500px) {
  .top { padding-block: 5px 4px; }
  .brand h1 { font-size: 18px; }
  .brand > span { display: none; }
  .brand h1 .dots { display: none; }
  .tabs button { padding: 4px 10px; font-size: 12.5px; }
  .iconbtn, .onbtn { height: 30px; }
  .iconbtn { width: 30px; }
  .play { gap: 5px; padding-bottom: 4px; }
  .pl { padding: 3px 7px; }
  .pl .ev { display: none; }
  .info { height: 38px; }
  .ibtn { width: 32px; height: 32px; }
  .navrow { padding: 1px 3px; }
  .navrow .ibtn { height: 28px; }
  .tray { padding: 4px; gap: 3px; }
  .controls .btn { padding: 4px 9px; font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  #board .anc.use circle, #board .best, .pl .think { animation: none; }
  #board .ghost { transition: none; }
  .tray .slot, .pl { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a class="home" href="../" title="チューリング・テーブル（ゲームの一覧）" aria-label="チューリング・テーブル（ゲームの一覧）へ">‹</a><h1><span class="dots" aria-hidden="true"><i style="background:var(--c0)"></i><i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i></span>ブロック<span class="h1b">陣取り</span></h1><span>CORNER TERRITORY</span></div>
  <nav class="tabs" role="tablist" aria-label="ページ">
    <button role="tab" id="tab-play" aria-selected="true" data-tab="play">対局</button>
    <button role="tab" id="tab-rules" aria-selected="false" data-tab="rules">ルール</button>
    <button role="tab" id="tab-ai" aria-selected="false" data-tab="ai">AI</button>
  </nav>
  <button class="onbtn" id="btn-online" data-st="off" title="オンライン（いまオンラインの人数・卓で待っている人数）"><span class="dot"></span><span class="lbl">オンライン</span><span class="cnt"></span></button>
  <div class="settings-wrap">
    <button class="iconbtn" id="btn-settings" aria-label="設定" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="popover" id="settings" hidden>
      <span class="hint" style="margin-bottom:-4px">AI補助（下の「AI補助」でまとめて切り替え）</span>
      <label class="switch"><input type="checkbox" id="set-eval" checked> 形勢（見込みの得点・順位）を表示</label>
      <label class="switch"><input type="checkbox" id="set-best" checked> おすすめの一手を盤に表示</label>
      <span class="hint" style="margin-bottom:-4px">そのほか</span>
      <label class="switch"><input type="checkbox" id="set-anchors" checked> 置ける角を光らせる</label>
      <label class="switch"><input type="checkbox" id="set-snap" checked> 置ける所に吸い付ける</label>
      <label class="switch"><input type="checkbox" id="set-sound" checked> 音</label>
      <label class="switch"><input type="checkbox" id="set-dark"> ダーク表示</label>
    </div>
  </div>
</header>

<main>
  <section id="view-play" class="play">
    <div class="players" id="players"></div>
    <div class="board-wrap" id="board-wrap">
      <svg id="board" viewBox="0 0 20 20" role="img" aria-label="盤"></svg>
      <div class="board-msg" id="board-msg" hidden></div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
    <div class="navrow" id="navrow">
      <button class="ibtn" data-nav="first" aria-label="最初の局面"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
      <button class="ibtn" data-nav="prev" aria-label="1手戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="tape" id="tape" aria-label="記録"></div>
      <button class="ibtn" data-nav="next" aria-label="1手進む"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="ibtn" data-nav="last" aria-label="最新の局面"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
    </div>
    <div class="tray" id="tray"></div>
    <div class="controls">
      <button class="btn primary" id="btn-new">新しい対局</button>
      <button class="btn" id="btn-hint">ヒント</button>
      <button class="btn aibtn" id="btn-ai" aria-pressed="true" title="形勢（見込み）とおすすめの一手をまとめて出し入れ"><span class="led"></span>AI補助</button>
      <div class="more-wrap">
        <button class="btn" id="btn-more" aria-label="そのほかの操作" aria-expanded="false">⋯</button>
        <div class="menu" id="menu-more" hidden role="menu">
          <button role="menuitem" id="btn-undo">待った（1手戻す）</button>
          <button role="menuitem" id="btn-panel">形勢・記録を見る</button>
          <button role="menuitem" id="btn-copy">記録をコピー</button>
          <button role="menuitem" id="btn-import">記録を読み込む</button>
          <button role="menuitem" id="btn-resign">投了する（残りをパス）</button>
        </div>
      </div>
    </div>
    <aside class="side" id="side" data-tab="ev" aria-label="形勢と記録">
      <div class="sheet-head">
        <div class="sheet-tabs" role="tablist">
          <button role="tab" data-st="ev" aria-selected="true">形勢</button>
          <button role="tab" data-st="graph" aria-selected="false">グラフ</button>
          <button role="tab" data-st="kifu" aria-selected="false">記録</button>
        </div>
        <button class="ibtn" data-act="sheet-close" aria-label="閉じる" style="margin-top:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="navrow-s" id="navrow-s">
        <button class="ibtn" data-nav="first" aria-label="最初の局面"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
        <button class="ibtn" data-nav="prev" aria-label="1手戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="tape" id="tape-s" aria-label="記録"></div>
        <button class="ibtn" data-nav="next" aria-label="1手進む"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ibtn" data-nav="last" aria-label="最新の局面"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
      </div>
      <div class="card evcard" id="evcard">
        <h2>形勢<span class="grow" id="ev-who"></span></h2>
        <div id="ev-body"></div>
      </div>
      <div class="card graph">
        <h2>見込みの得点の移り変わり<span class="grow">タップでその局面へ</span></h2>
        <svg id="graph" viewBox="0 0 300 110" preserveAspectRatio="none" role="img" aria-label="手ごとの各色の見込みの得点"></svg>
      </div>
      <div class="card kifucard">
        <h2>記録<span class="grow" id="kifu-info"></span></h2>
        <ol class="kifu" id="kifu"></ol>
      </div>
    </aside>
  </section>
  <section id="view-rules" class="doc" hidden></section>
  <section id="view-ai" class="doc" hidden></section>
</main>

<!-- 新しい対局 -->
<div class="overlay" id="dlg-new" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ng-title">
    <h2 id="ng-title">新しい対局</h2>
    <div class="field"><span class="lab">遊び方</span><div class="seg" id="ng-mode"></div><span class="hint" id="ng-mode-hint"></span></div>
    <div class="field"><span class="lab">相手</span><div class="seg" id="ng-opp"></div></div>
    <div class="field" id="ng-cpu-field"><span class="lab">CPUの強さ</span><div class="cards" id="ng-cpu"></div><span class="hint" id="ng-cpu-desc"></span></div>
    <div class="field" id="ng-side-field"><span class="lab">あなたの色</span><div class="seg" id="ng-side"></div></div>
    <div class="actions">
      <button class="btn" id="ng-cancel">やめる</button>
      <button class="btn primary" id="ng-start">対局を始める</button>
    </div>
  </div>
</div>

<!-- 終局 -->
<div class="overlay" id="dlg-result" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rs-title" style="width:min(460px,100%)">
    <p class="hint" id="rs-sub" style="margin:0 0 4px"></p>
    <h2 class="result-title" id="rs-title"></h2>
    <table class="rank" id="rs-table"></table>
    <p class="hint" id="rs-body" style="margin:0 0 12px"></p>
    <div class="actions">
      <button class="btn" id="rs-review">振り返る</button>
      <button class="btn" id="rs-new">設定を変える</button>
      <button class="btn primary" id="rs-again">もう一局</button>
    </div>
  </div>
</div>

<!-- オンライン -->
<div class="overlay" id="dlg-online" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="on-title">
    <h2 id="on-title">オンライン</h2>
    <div id="on-body"></div>
    <div class="actions"><button class="btn" id="on-close">閉じる</button></div>
  </div>
</div>

<!-- 記録の読み込み -->
<div class="overlay" id="dlg-import" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="im-title">
    <h2 id="im-title">記録を読み込む</h2>
    <p class="hint">「記録をコピー」で書き出した形（1行目に「ブロック陣取り 記録（4人）」）をそのまま貼り付けてください。</p>
    <textarea id="im-text" aria-label="記録"></textarea>
    <p class="hint" id="im-msg"></p>
    <div class="actions">
      <button class="btn" id="im-cancel">やめる</button>
      <button class="btn primary" id="im-ok">読み込む</button>
    </div>
  </div>
</div>
